# .github/workflows/test.yml
name: CI - Unit Test

on:
  push:
    branches:
      - dev
    paths:
      - 'nacho/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches: ["dev", "staging", "main"]
    paths:
      - 'nacho/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'

  workflow_dispatch:

# Concurrency settings:
# - For PRs: Cancel older runs for the same PR.
# - For pushes: Cancel older runs for the same branch.
# - workflow_dispatch runs will run independently.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
      fail-fast: false # Ensure all Python versions are tested
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      # fetch-depth: 0 # Usually not needed for tests unless testing git history itself

    - name: Set up uv with Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.7.9"
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - name: Install locked dependencies
      run: uv sync --frozen --all-extras

    - name: Run tests with coverage
      run: uv run pytest --cov=nacho --cov-report=xml

    - name: Upload coverage to Codecov
      # Upload from a single matrix leg to avoid duplicate reports.
      if: matrix.python-version == '3.13'
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
        # Do not fail CI when the upload fails (e.g. fork PRs have no CODECOV_TOKEN).
        fail_ci_if_error: false
        name: codecov-${{ matrix.python-version }}
        flags: unittests
        verbose: true
  live-tests:
    name: Integration & E2E (live server)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.7.9"
        python-version: '3.13'
        enable-cache: true

    - name: Install locked dependencies
      run: uv sync --frozen --all-extras

    - name: Run integration and e2e suites
      run: uv run pytest -m "integration or e2e" --no-cov -v
