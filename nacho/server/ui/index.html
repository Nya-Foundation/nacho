<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nacho — Configuration Manager</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20512%20512'%3E%3Crect%20width='512'%20height='512'%20rx='116'%20fill='%231E1E1B'/%3E%3Cpath%20d='M%20118%20388%20L%20118%20234%20A%2092%2092%200%200%201%20302%20234%20L%20302%20388%20L%20244%20388%20L%20244%20234%20A%2034%2034%200%200%200%20176%20234%20L%20176%20388%20Z'%20fill='%23F6F6F3'/%3E%3Ccircle%20cx='372'%20cy='342'%20r='46'%20fill='%23D6892A'/%3E%3C/svg%3E" />
<style>
/* ===================================================================== */
/* Design tokens — "Paper & Dot". Light is the primary canvas.            */
/* ===================================================================== */
/* Contrast note: every value below is measured against its own canvas.
   --muted carries data and must clear AA (4.5); --faint is decoration and
   clears 3:1; --amber-mark is the dot colour, a graphic that must clear 3:1
   where plain --amber (a wash/border tint) need not. */
:root {
  --paper: #F2F3EF;
  --sheet: #FFFFFF;
  --sidebar: #F8F8F5;
  --elevated: #FFFFFF;
  --ink: #1E1E1B;
  --ink-strong: #141412;
  --muted: #6B6B61;        /* 4.94 on paper */
  --faint: #8A8A7E;        /* 3.12 on paper */
  --rule: #DFE0D9;
  --rule-strong: #B7B6AB;  /* 2.24 — hairlines read, inputs get --rule-input */
  --rule-input: #8C8B82;   /* 3.16 — the sole affordance of an underline input */
  --hover: color-mix(in srgb, var(--ink) 5%, transparent);
  --amber: #D6892A;
  --amber-strong: #A8681B;
  --amber-mark: #B8731E;   /* 3.52 — dots, 5-7px graphics */
  --danger: #B3402F;
  --ok: #43724F;
  --scrim: rgba(30,30,27,.45);
  --c-str: #3C6B4C;
  --c-num: #2F5C86;
  --c-kw: #7A4E88;
  --add-bg: color-mix(in srgb, var(--ok) 11%, transparent);
  --del-bg: color-mix(in srgb, var(--danger) 10%, transparent);
  --mk-tile: #1E1E1B;
  --mk-n: #F6F6F3;
  --mk-dot: #D6892A;
  --shadow-sm: 0 1px 2px rgba(20,20,18,.04), 0 8px 24px rgba(20,20,18,.035);
  --shadow: 0 24px 48px -12px rgba(20,20,18,.25);
  --r-btn: 6px;
  --r-code: 10px;
  --r-modal: 14px;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #141412;
    --sheet: #282824;      /* 1.25 against paper — the code tile is a real plane */
    --sidebar: #1B1B18;
    --elevated: #22221F;
    --ink: #F6F6F3;
    --ink-strong: #FFFFFF;
    --muted: #8E8E83;      /* 5.66 on paper */
    --faint: #6E6E64;      /* 3.35 on paper */
    --rule: #32322C;
    --rule-strong: #45453D;
    --rule-input: #6E6E64;
    --amber: #CE9038;
    --amber-strong: #E6B063;
    --amber-mark: #CE9038;
    --danger: #E06A55;
    --ok: #8AB394;
    --scrim: rgba(0,0,0,.6);
    --c-str: #8FB79B;
    --c-num: #8AB0D2;
    --c-kw: #BE9FC8;
    --mk-tile: #F6F6F3;
    --mk-n: #1E1E1B;
    --mk-dot: #CE9038;
    --shadow: 0 24px 48px -12px rgba(0,0,0,.55);
  }
}

/* An explicit choice wins over the OS preference. The default stays
   automatic, but operators working in a dark control room (or bright office)
   can keep this tool in the mode that suits the job. */
:root[data-theme="light"] {
  color-scheme: light;
  --paper: #F2F3EF; --sheet: #FFFFFF; --sidebar: #F8F8F5; --elevated: #FFFFFF;
  --ink: #1E1E1B; --ink-strong: #141412; --muted: #6B6B61; --faint: #8A8A7E;
  --rule: #DFE0D9; --rule-strong: #B7B6AB; --rule-input: #8C8B82;
  --amber: #D6892A; --amber-strong: #A8681B; --amber-mark: #B8731E;
  --danger: #B3402F; --ok: #43724F; --scrim: rgba(30,30,27,.45);
  --c-str: #3C6B4C; --c-num: #2F5C86; --c-kw: #7A4E88;
  --mk-tile: #1E1E1B; --mk-n: #F6F6F3; --mk-dot: #D6892A;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #141412; --sheet: #282824; --sidebar: #1B1B18; --elevated: #22221F;
  --ink: #F6F6F3; --ink-strong: #FFFFFF; --muted: #A2A298; --faint: #77776D;
  --rule: #32322C; --rule-strong: #4B4B43; --rule-input: #74746A;
  --amber: #CE9038; --amber-strong: #E6B063; --amber-mark: #CE9038;
  --danger: #E06A55; --ok: #8AB394; --scrim: rgba(0,0,0,.64);
  --c-str: #8FB79B; --c-num: #8AB0D2; --c-kw: #BE9FC8;
  --mk-tile: #F6F6F3; --mk-n: #1E1E1B; --mk-dot: #CE9038;
}

/* ===================================================================== */
/* Base                                                                   */
/* ===================================================================== */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--sans);
  background: var(--paper);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; font-size: 13px; cursor: pointer; color: inherit; }
input, textarea { font-family: inherit; font-size: 13px; color: var(--ink); }
h1, h2, h3 { margin: 0; }
.hidden { display: none !important; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--amber-strong); outline-offset: 2px; }

/* Type utilities */
.lbl {
  font-size: 11px; line-height: 1.2; font-weight: 600;
  letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.mono-data {
  font-family: var(--mono); font-size: 12.5px; line-height: 1.5;
  font-weight: 450; font-variant-numeric: tabular-nums;
}
.sep { color: var(--faint); }
.faint { color: var(--faint); }
.sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px;
  clip-path: inset(50%); overflow: hidden; white-space: nowrap;
}
.spacer { flex: 1; }
.hint { font-size: 13px; color: var(--muted); margin: 12px 0 0; }

/* Wordmark — lowercase name + a true circular amber dot */
.wordmark {
  font-weight: 650; letter-spacing: -.022em;
  color: var(--ink-strong); user-select: none; white-space: nowrap;
}
.wm-dot {
  display: inline-block; width: .15em; height: .15em; border-radius: 50%;
  background: var(--amber); margin-left: .09em;
}

/* Brand marks via <use>; symbol fills come from inherited custom props */
.arch { fill: var(--faint); display: block; margin: 0 auto 12px; }

/* ===================================================================== */
/* Ink button (the only button) + text links                              */
/* ===================================================================== */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  height: 28px; padding: 0 14px; border: 0; border-radius: var(--r-btn);
  background: var(--ink); color: var(--paper);
  font-size: 13px; font-weight: 500;
  transition: opacity .12s ease-out, transform .12s ease-out, box-shadow .12s ease-out;
}
.btn:hover { opacity: .88; }
.btn:active { opacity: .8; transform: translateY(1px); }
/* Nothing to save is an absence, not a heavy grey slab: the button empties
   out into an outline — a slot waiting for a change. */
.btn:disabled {
  opacity: 1; background: transparent; color: var(--faint);
  box-shadow: inset 0 0 0 1px var(--rule-strong); pointer-events: none;
}
.btn.danger { background: var(--danger); color: #fff; }
.btn.armed::before {
  content: ""; width: 5px; height: 5px; border-radius: 50%;
  background: var(--amber-mark); margin-right: 7px; flex: none;
}

.link {
  display: inline-block; border: 0; background: none;
  padding: 6px 4px; margin: -6px -4px;
  font-size: 13px; font-weight: 500; color: var(--muted);
  text-decoration: none; transition: color .12s ease-out;
}
.link:hover {
  color: var(--ink); text-decoration: underline;
  text-underline-offset: 3px; text-decoration-color: var(--rule-strong);
}
.link.danger:hover { color: var(--danger); }
.link:disabled { color: var(--faint); pointer-events: none; }
.link.faint { color: var(--faint); }
.link.faint:hover { color: var(--muted); }
.link:focus-visible { border-radius: 2px; }

/* ===================================================================== */
/* Format switcher — visually-hidden radios + styled text labels          */
/* ===================================================================== */
.fmt-group {
  position: relative; display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: 12px; font-weight: 450;
  font-variant-numeric: tabular-nums;
}
.fmt-radio {
  position: absolute; width: 1px; height: 1px; margin: -1px;
  clip-path: inset(50%); overflow: hidden; white-space: nowrap;
}
.fmt-opt {
  color: var(--muted); cursor: pointer; padding: 6px 2px; margin: -6px 0;
  transition: color .12s ease-out;
}
.fmt-opt:hover { color: var(--ink); }
.fmt-radio:checked + .fmt-opt {
  color: var(--ink-strong); font-weight: 600;
  text-decoration: underline; text-underline-offset: 4px;
  text-decoration-color: var(--rule-strong);
}
.fmt-radio:focus-visible + .fmt-opt {
  outline: 2px solid var(--amber-strong); outline-offset: 2px; border-radius: 2px;
}

/* ===================================================================== */
/* Inputs — prose is written on the page; code sits in a tile             */
/* ===================================================================== */
.u-input {
  display: block; width: 100%; border: 0;
  border-bottom: 1px solid var(--rule-input);
  background: transparent; padding: 6px 0;
  font-size: 14px; border-radius: 0;
}
.u-input:focus {
  outline: none;
  border-bottom: 2px solid var(--amber-strong); margin-bottom: -1px;
}
.u-input::placeholder { color: var(--faint); }

.box-code {
  display: block; width: 100%;
  border: 1px solid var(--rule-strong); border-radius: var(--r-btn);
  background: var(--sheet);
  font-family: var(--mono); font-size: 12.5px; line-height: 1.65; tab-size: 2;
  padding: 10px 12px; white-space: pre; resize: vertical;
}
.box-code:focus { outline: none; border-color: var(--amber-strong); }
.box-code::placeholder { color: var(--faint); }

/* ===================================================================== */
/* Code editor (transparent textarea over a highlighted backdrop)         */
/* ===================================================================== */
.code-wrap {
  position: relative; height: 360px;
  border: 1px solid var(--rule); border-radius: var(--r-code);
  background: var(--sheet); overflow: hidden;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.6), var(--shadow-sm);
}
@media (prefers-color-scheme: dark) {
  .code-wrap { box-shadow: inset 0 1px 0 rgba(255,255,255,.04); }
}
/* The editor grows with the viewport, but remains a manageable reading
   surface on both short laptops and tall desktop displays. */
.code-wrap.cfg { height: clamp(420px, calc(100dvh - 390px), 760px); }
.code-wrap.sch { height: clamp(380px, calc(100dvh - 440px), 680px); }
.code-wrap.focus { outline: 2px solid var(--amber-strong); outline-offset: -2px; }
.code-hl, .code-input {
  position: absolute; inset: 0; margin: 0; padding: 16px 20px 16px 62px; border: 0;
  font-family: var(--mono); font-size: 12.5px; line-height: 1.65;
  tab-size: 2; white-space: pre;
}
.code-lines {
  position: absolute; z-index: 2; left: 0; top: 0; bottom: 0; width: 46px;
  padding: 16px 10px 16px 0; overflow: hidden; pointer-events: none;
  border-right: 1px solid var(--rule); background: color-mix(in srgb, var(--paper) 55%, var(--sheet));
  color: var(--faint); text-align: right; white-space: pre;
  font-family: var(--mono); font-size: 11px; line-height: 1.875;
  font-variant-numeric: tabular-nums; user-select: none;
}
.code-hl { z-index: 0; overflow: hidden; pointer-events: none; color: var(--ink); }
.code-hl code { font: inherit; }
.code-input {
  z-index: 1; overflow: auto; background: transparent;
  color: transparent; caret-color: var(--ink); resize: none;
}
.code-input:focus { outline: none; }
.code-input::selection { background: color-mix(in srgb, var(--amber) 25%, transparent); }
/* Escape hatch for the tab-capture trap; visible only while the editor
   has focus, so it teaches exactly when the trap is armed. */
.code-esc {
  font-size: 11px; color: var(--muted); margin: 8px 2px 0;
  opacity: .78; transition: opacity .12s ease-out;
}
.code-wrap.focus + .code-esc { opacity: 1; color: var(--ink); }
.code-esc kbd {
  font-family: var(--mono); font-size: 11px; color: var(--ink);
  border: 1px solid var(--rule-strong); border-radius: 3px; padding: 0 4px;
}
/* Keys stay ink: the key path is how you navigate a config, not scaffolding
   to be muted. Values earn their separation through value contrast instead. */
.tok-key { color: var(--ink); font-weight: 600; }
.tok-str { color: var(--c-str); font-weight: 500; }
.tok-num { color: var(--c-num); font-weight: 500; }
.tok-kw  { color: var(--c-kw); font-weight: 500; }
.tok-comment { color: var(--muted); font-style: italic; }

/* ===================================================================== */
/* Sign-in — the title page. Cardless: elements sit directly on paper.    */
/* ===================================================================== */
#connect-view {
  min-height: 100%; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 24px;
  padding-bottom: 10vh;
}
.signin-mark { width: 56px; height: 56px; display: block; }
#connect-view .wordmark { font-size: 32px; line-height: 1.15; margin-top: 24px; }
.signin-sub { font-size: 13px; color: var(--muted); margin: 4px 0 0; }
.signin-col { width: 320px; max-width: 100%; margin-top: 40px; }
.signin-col .lbl { display: block; margin-bottom: 6px; }
.signin-btn { width: 100%; height: 36px; margin-top: 20px; }
.connect-error { font-size: 13px; color: var(--danger); min-height: 20px; margin-top: 12px; }
.signin-ver { margin-top: 32px; text-align: center; color: var(--faint); }

/* ===================================================================== */
/* Shell — a focused workspace with a persistent app navigator            */
/* ===================================================================== */
#app-view { height: 100%; display: flex; flex-direction: column; }
.masthead {
  display: flex; align-items: center; gap: 12px;
  height: 62px; padding: 0 22px; flex: none;
  border-bottom: 1px solid var(--rule); background: var(--elevated);
  box-shadow: 0 1px 0 rgba(20,20,18,.015); z-index: 20;
}
.mast-mark { width: 28px; height: 28px; display: block; }
.masthead .wordmark { font-size: 16px; }
.masthead .ver { color: var(--muted); }
.ro-flag { color: var(--danger); }
.icon-btn {
  display: inline-grid; place-items: center; width: 32px; height: 32px;
  border: 1px solid var(--rule); border-radius: 8px; background: transparent;
  color: var(--muted); transition: background .12s, color .12s, border-color .12s;
}
.icon-btn:hover { background: var(--hover); color: var(--ink); border-color: var(--rule-strong); }
.icon-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; }
.nav-toggle { margin-left: 4px; }
.nav-toggle .collapse-chevron {
  transform-origin: center; transition: transform .18s ease-out;
}
.mast-link { white-space: nowrap; }
.mast-divider { width: 1px; height: 20px; background: var(--rule); margin: 0 2px; }

.layout { flex: 1; display: flex; min-height: 0; }
.index {
  width: 276px; flex: none; display: flex; flex-direction: column;
  border-right: 1px solid var(--rule); overflow-y: auto; background: var(--sidebar);
  opacity: 1; visibility: visible;
  transition: width .18s ease-out, opacity .14s ease-out, visibility .18s;
}
.index-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 22px 18px 10px; flex: none;
}
.index-title { display: inline-flex; align-items: center; gap: 8px; }
.app-count {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px;
  background: color-mix(in srgb, var(--ink) 7%, transparent);
  color: var(--muted); font-family: var(--mono); font-size: 10px;
}
.new-app-action { height: 30px; padding: 0 10px; border-radius: 8px; }
.app-list { flex: 1; }
.app-item {
  position: relative; display: flex; align-items: center;
  justify-content: space-between; gap: 12px;
  width: calc(100% - 20px); min-height: 60px; padding: 10px 12px;
  margin: 2px 10px; border: 1px solid transparent; border-radius: 10px;
  background: none; text-align: left; font-size: 14px;
  transition: background .12s, border-color .12s, box-shadow .12s;
}
.app-item:hover { background: var(--hover); }
.app-copy { min-width: 0; display: grid; gap: 2px; }
.app-item .app-name {
  font-weight: 600; color: var(--ink);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  transition: color .12s ease-out;
}
.app-desc {
  color: var(--muted); font-size: 12px; line-height: 1.35;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.app-item .app-meta {
  display: grid; justify-items: end; gap: 2px; flex: none;
  font-family: var(--mono); font-size: 10.5px; line-height: 1.35;
  font-variant-numeric: tabular-nums; color: var(--faint);
}
.app-meta .app-rev { color: var(--muted); }

/* Sidebar filter — the index is already in memory, so this is a pure
   client-side narrowing of a list that is unusable by scroll past ~30 apps. */
.index-filter { padding: 2px 18px 10px; flex: none; }
.index-filter input {
  display: block; width: 100%; height: 34px; border: 1px solid var(--rule);
  border-radius: 8px; background: var(--sheet); padding: 0 10px; font-size: 12px;
}
.index-filter input:focus {
  outline: none; border-color: var(--amber-strong);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--amber) 12%, transparent);
}
.index-filter input::placeholder { color: var(--faint); }
.filter-empty { padding: 8px 24px; color: var(--muted); font-size: 13px; }
.app-item.active {
  background: var(--sheet); border-color: var(--rule);
  box-shadow: var(--shadow-sm);
}
.app-item.active .app-name { color: var(--ink-strong); font-weight: 650; }
.app-item.active .app-meta { color: var(--muted); }
/* Positional markers ("you are here") are ink; amber is reserved for state
   that changes under you — live, unsaved, current revision. In the dirty
   state the old rules fired six amber dots at once, which marks nothing. */
.app-item.active::before {
  content: ""; position: absolute; left: -1px; top: 16px; bottom: 16px;
  width: 3px; border-radius: 0 3px 3px 0; background: var(--amber-mark);
}
.index-empty {
  text-align: center; margin-top: 24px; padding: 0 16px;
  color: var(--muted); font-size: 13px;
}
.index-empty p { margin: 0 0 8px; }

.content { flex: 1; overflow-y: auto; min-width: 0; background: var(--paper); }
#content { max-width: 1240px; margin: 0 auto; padding: 34px 40px 64px; }

/* Configuration work often benefits from every available column. Keep the
   app navigator one click away, and remember the operator's desktop choice. */
@media (min-width: 880px) {
  #app-view.nav-collapsed .index {
    width: 0; border-right-width: 0; opacity: 0; visibility: hidden;
  }
  #app-view.nav-collapsed .nav-toggle .collapse-chevron {
    transform: rotate(180deg);
  }
}

/* The workspace is intentionally wider than a prose page: configuration
   lines and history diffs need horizontal room, while the max width keeps
   actions and status from drifting too far apart on large displays. */
.empty-state { text-align: center; margin-top: 96px; color: var(--muted); font-size: 13px; }
.empty-state p { margin: 0; }

/* ===================================================================== */
/* App detail header + status line                                        */
/* ===================================================================== */
.dh-row { display: flex; align-items: center; gap: 12px; }
.detail-kicker { margin: 0 0 4px; color: var(--amber-strong); }
.detail-head h1 {
  font-size: 28px; line-height: 1.15; font-weight: 680;
  letter-spacing: -.028em; color: var(--ink-strong);
  overflow-wrap: anywhere;
}
.dh-actions { display: flex; align-items: center; gap: 6px; flex: none; }
.dh-actions .link {
  padding: 6px 10px; margin: 0; border: 1px solid var(--rule); border-radius: 7px;
  background: var(--sheet); text-decoration: none; box-shadow: 0 1px 1px rgba(20,20,18,.02);
}
.dh-actions .link:hover { border-color: var(--rule-strong); text-decoration: none; }
.dh-actions .sep { display: none; }
.desc { margin: 4px 0 0; color: var(--muted); }
.desc.none { color: var(--faint); font-style: italic; }
.status-line {
  display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
  margin: 18px 0 0;
  font-family: var(--mono); font-size: 12px; font-weight: 450;
  font-variant-numeric: tabular-nums; color: var(--muted);
}
.status-line > .st-item {
  min-height: 30px; display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px; border: 1px solid var(--rule); border-radius: 999px;
  background: color-mix(in srgb, var(--sheet) 75%, transparent);
}
.status-line > .st-sep { display: none; }
.st-item .st-k { color: var(--faint); }
.live-seg { display: inline-flex; align-items: center; gap: 6px; }
/* inline-block, not inline: width/height must hold whatever the parent's
   display happens to be. */
.live-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; flex: none; }
.live-dot.on { background: var(--amber-mark); }
.live-dot.off {
  background: transparent;
  box-shadow: inset 0 0 0 1.5px var(--muted);
  animation: recon 1.6s ease-in-out infinite;
}
.live-dot.on.pulse { animation: halo .9s ease-out 2; }
@keyframes halo {
  from { box-shadow: 0 0 0 0 color-mix(in srgb, var(--amber-mark) 35%, transparent); }
  to   { box-shadow: 0 0 0 6px transparent; }
}
@keyframes recon { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

/* ===================================================================== */
/* Tabs — a compact segmented control, with draft dots on inactive tabs   */
/* ===================================================================== */
.tabs {
  display: inline-flex; gap: 4px; margin-top: 24px; padding: 4px;
  border: 1px solid var(--rule); border-radius: 10px;
  background: color-mix(in srgb, var(--ink) 3%, transparent);
}
.tab {
  position: relative; border: 0; border-radius: 7px; background: none; padding: 6px 14px;
  font-size: 13px; font-weight: 500; color: var(--muted);
  transition: color .12s ease-out;
}
.tab:hover { color: var(--ink); }
.tab.active {
  color: var(--ink-strong); font-weight: 600; background: var(--sheet);
  box-shadow: 0 1px 3px rgba(20,20,18,.08);
}
.tab-dot {
  display: inline-block; width: 5px; height: 5px; border-radius: 50%;
  background: var(--amber-mark); margin-left: 6px; vertical-align: 2px;
}
/* On the tab you are already looking at, the toolbar status says the same
   thing in words — the dot is only a signal about the tab you are not on. */
.tab.active .tab-dot { display: none; }

/* ===================================================================== */
/* Editor toolbar                                                         */
/* ===================================================================== */
/* Gaps encode grouping: 20px between the three semantic clusters (format /
   actions / status+save), negative margin to bind items within a cluster. */
.toolbar {
  position: sticky; top: -18px; z-index: 10;
  display: flex; align-items: center; gap: 20px;
  margin: -2px 0 14px; padding: 10px 0;
  background: var(--elevated);
}
.fmt-group + .link { margin-left: -8px; }
.toolbar .link + .link { margin-left: -8px; }
.ed-status { display: inline-flex; align-items: center; gap: 8px; margin-right: 4px; }
.ed-status .status-text { color: var(--muted); }
.ed-status .status-text.dirty { color: var(--ink); }
.ed-status .status-text:focus-visible { outline-offset: 3px; border-radius: 2px; }
.sdot { color: var(--amber-mark); }
#tab-body {
  margin-top: 16px; padding: 18px;
  border: 1px solid var(--rule); border-radius: 14px;
  background: var(--elevated); box-shadow: var(--shadow-sm);
}

/* ===================================================================== */
/* Notices — editorial rules, not boxes                                   */
/* ===================================================================== */
.notice {
  border-left: 2px solid var(--rule-strong);
  padding: 6px 14px; margin-bottom: 12px;
  font-size: 13px; color: var(--ink);
}
.notice.error {
  border-left-color: var(--danger);
  background: color-mix(in srgb, var(--danger) 6%, transparent);
  border-radius: 0 6px 6px 0;
}
.notice.warn {
  border-left-color: var(--amber);
  background: color-mix(in srgb, var(--amber) 6%, transparent);
  border-radius: 0 6px 6px 0;
}
.notice.ok {
  border-left-color: var(--ok);
  background: color-mix(in srgb, var(--ok) 6%, transparent);
  border-radius: 0 6px 6px 0;
}
.notice ul { margin: 4px 0 0; padding-left: 18px; color: var(--muted); }
.notice li { margin: 2px 0; }
.notice .link { margin-left: 4px; }
.err-path {
  font-family: var(--mono); font-size: 12px; color: var(--ink);
  background: color-mix(in srgb, var(--ink) 6%, transparent);
  border-radius: 3px; padding: 1px 5px; margin-right: 2px;
}

/* ===================================================================== */
/* History — a typeset table                                              */
/* ===================================================================== */
.history-wrap { overflow-x: auto; }
.history-table {
  width: 100%; border-collapse: collapse; font-size: 13px;
  table-layout: fixed; min-width: 560px;
}
.history-table th {
  text-align: left; padding: 8px 12px 8px 0;
  border-bottom: 1px solid var(--rule-strong);
  font-size: 11px; font-weight: 600; letter-spacing: .08em;
  text-transform: uppercase; color: var(--muted);
}
.history-table td {
  text-align: left; padding: 11px 12px 11px 0;
  border-bottom: 1px solid var(--rule);
}
.history-table th:nth-child(1), .history-table td:nth-child(1) { width: 124px; }
.history-table th:nth-child(2), .history-table td:nth-child(2) { width: 148px; }
.history-table th:nth-child(3), .history-table td:nth-child(3) { width: auto; }
.history-table th:nth-child(4), .history-table td:nth-child(4) { width: 132px; text-align: right; }
.history-table tbody tr:hover { background: var(--hover); }
.history-table tbody tr.snap-row:hover { background: none; }
.cur-dot {
  display: inline-block; width: 5px; height: 5px; border-radius: 50%;
  background: var(--amber-mark); margin-left: 6px; vertical-align: 1px;
}
.hist-when { color: var(--muted); }
.hist-when .rel { color: var(--ink); }

/* Change column: the shape of a revision at a glance. */
.chg { display: inline-flex; align-items: baseline; gap: 8px; }
.chg-stat { font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }
.chg-add { color: var(--ok); font-weight: 600; }
.chg-del { color: var(--danger); font-weight: 600; }
.chg-path {
  font-family: var(--mono); font-size: 12px; color: var(--muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.chg-none { color: var(--faint); }
.chg-schema { color: var(--c-kw); font-size: 12px; }

/* Unified diff */
.diff-head {
  display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  font-family: var(--mono); font-size: 12px; color: var(--muted); margin: 0 0 8px;
}
.diff-head .spacer { flex: 1; }
.diff-pre {
  margin: 0; background: var(--sheet);
  border: 1px solid var(--rule); border-radius: var(--r-code);
  padding: 8px 0; font-family: var(--mono); font-size: 12.5px;
  line-height: 1.65; overflow: auto; max-height: 400px;
}
.dl { display: block; padding: 0 14px 0 0; white-space: pre; }
.dl::before {
  content: attr(data-m); display: inline-block; width: 22px;
  padding-left: 8px; color: var(--faint); user-select: none;
}
.dl.add { background: var(--add-bg); }
.dl.del { background: var(--del-bg); }
.dl.add::before { color: var(--ok); }
.dl.del::before { color: var(--danger); }
.dl.gap {
  color: var(--faint); background: none;
  border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
  margin: 4px 0;
}
.cur-txt { color: var(--muted); }
.schema-col { color: var(--muted); }
.row-actions { text-align: right; white-space: nowrap; }
.row-actions .link + .link { margin-left: 16px; }
.snap-row td { padding: 8px 0 16px; }
.snap-head { font-family: var(--mono); font-size: 12px; color: var(--muted); margin: 0 0 8px; }
.snap-pre {
  margin: 0; background: var(--sheet);
  border: 1px solid var(--rule); border-radius: var(--r-code);
  padding: 12px 14px; font-family: var(--mono); font-size: 12.5px;
  line-height: 1.65; overflow: auto; max-height: 320px;
}
.hist-empty { color: var(--muted); font-size: 13px; }

/* ===================================================================== */
/* Modal                                                                  */
/* ===================================================================== */
#modal-overlay {
  position: fixed; inset: 0; z-index: 1000;
  background: var(--scrim); backdrop-filter: blur(2px);
  display: flex; align-items: center; justify-content: center; padding: 20px;
  animation: fadein .16s ease-out;
}
.modal {
  background: var(--sheet);
  border: 1px solid var(--rule); border-radius: var(--r-modal);
  width: 480px; max-width: calc(100vw - 40px);
  max-height: 90vh; overflow-y: auto; padding: 28px;
  box-shadow: var(--shadow);
  animation: sheetin .18s ease-out;
}
.modal h3 {
  font-size: 18px; line-height: 1.3; font-weight: 650;
  letter-spacing: -.015em; color: var(--ink-strong); margin-bottom: 20px;
}
@keyframes fadein { from { opacity: 0; } }
@keyframes sheetin { from { opacity: 0; transform: scale(.985); } }
.field { margin-bottom: 16px; }
.field > .lbl { display: block; margin-bottom: 6px; }
.field-head {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 6px;
}
.field-head .lbl { margin-bottom: 0; }
.field-hint { font-size: 12px; color: var(--faint); margin: 6px 0 0; }
.opt { color: var(--faint); }
.confirm-body { font-size: 13px; color: var(--muted); margin: 0; }
.modal-error { font-size: 13px; color: var(--danger); min-height: 18px; margin-top: 4px; }
.modal-actions {
  display: flex; justify-content: flex-end; align-items: center;
  gap: 16px; margin-top: 24px;
}

/* ===================================================================== */
/* Toast                                                                  */
/* ===================================================================== */
#toast {
  position: fixed; bottom: 24px; left: 50%; z-index: 1100;
  transform: translateX(-50%) translateY(6px);
  background: var(--ink); color: var(--paper);
  padding: 10px 18px; border-radius: 8px; font-size: 13px;
  box-shadow: var(--shadow);
  opacity: 0; transition: opacity .2s, transform .2s;
  pointer-events: none;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ===================================================================== */
/* Responsive                                                             */
/* ===================================================================== */
@media (max-width: 879px) {
  .masthead { height: 56px; padding: 0 16px; }
  .nav-toggle { display: none; }
  .layout { flex-direction: column; }
  .index {
    width: 100%; height: 56px; flex: none;
    flex-direction: row; align-items: stretch;
    border-right: 0; border-bottom: 1px solid var(--rule);
    overflow-y: hidden; overflow-x: auto;
  }
  .index-head {
    order: 2; margin-left: auto; padding: 0 10px;
    align-items: center; flex: none; position: sticky; right: 0; z-index: 4;
    background: var(--sidebar); box-shadow: -10px 0 16px var(--sidebar);
  }
  .index-head .index-title { display: none; }
  .new-app-action { width: 34px; padding: 0; font-size: 0; }
  .new-app-action::before { content: "+"; font-size: 18px; line-height: 1; }
  .index-filter { display: none; }
  .app-list { order: 1; display: flex; align-items: stretch; flex: none; }
  .app-item {
    width: auto; min-width: 108px; height: 44px; min-height: 44px;
    margin: 6px 2px; padding: 0 12px; border-radius: 8px;
  }
  .app-item .app-meta, .app-item .app-desc { display: none; }
  .app-item.active::before { left: 8px; right: 8px; top: auto; bottom: -7px; width: auto; height: 3px; }
  .index-empty { margin: 0; display: flex; align-items: center; gap: 8px; padding: 0 16px; }
  .index-empty .arch { display: none; }
  .index-empty p { margin: 0; }
  #content { padding: 24px 20px 48px; }
}
@media (max-width: 559px) {
  .masthead .ver, .masthead .wordmark, .mast-divider { display: none; }
  .dh-row { flex-wrap: wrap; }
  .detail-head h1 { font-size: 24px; }
  .dh-actions { width: 100%; }
  .status-line { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; }
  .status-line > .st-item { white-space: nowrap; }
  .tabs { display: flex; width: 100%; }
  .tab { flex: 1; padding-inline: 8px; }
  #tab-body { margin-top: 12px; padding: 12px; border-radius: 12px; }
  .toolbar { top: -12px; flex-wrap: wrap; gap: 12px; row-gap: 8px; padding: 8px 0; }
  .toolbar > .spacer { display: none; }
  .toolbar .ed-status { margin-left: auto; }
  .code-hl, .code-input { padding-left: 48px; }
  .code-lines { width: 36px; padding-right: 7px; }
  .code-wrap.cfg, .code-wrap.sch { height: max(340px, calc(100dvh - 470px)); }
  .modal { padding: 22px; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

<script>
"use strict";
/* ===================================================================== */
/* Mount base — derived from where the UI was served, so the same bundle  */
/* works whether the orchestrator is mounted at "/" or under a subpath    */
/* such as "/config". At "/ui" → BASE = ""; at "/config/ui" → "/config".  */
/* ===================================================================== */
const BASE = location.pathname.replace(/\/ui\/?$/, "");
const COOKIE_PATH = BASE || "/";

/* ===================================================================== */
/* PUBLIC EMBEDDING CONTRACT — do not rename without a major release.     */
/* Host applications that mount this UI behind their own session auth     */
/* pre-authenticate it by seeding these two same-origin stores before     */
/* navigating here, so their users are not asked to log in twice:         */
/*   localStorage["nacho_api_key"]  → REST Authorization: Bearer header   */
/*   cookie "NACHO_api_key" (URL-encoded, path=COOKIE_PATH above)         */
/*                                   → WebSocket handshake, which cannot  */
/*                                     carry headers                      */
/* Documented in README.md, "Pre-authenticating an embedded UI".          */
/* ===================================================================== */

/* ===================================================================== */
/* State                                                                  */
/* ===================================================================== */
const FORMATS = ["json", "yaml", "toml"];
const state = {
  apiKey: localStorage.getItem("nacho_api_key") || "",
  authRequired: true,
  readOnly: false,
  apps: {},          // name -> info
  selected: null,    // app name
  generation: null,  // server process identity; revisions are scoped to it
  revision: null,
  configObj: {},     // server-truth config object
  configFormat: localStorage.getItem("nacho_config_format") || "json",
  pristine: "",      // editor text of configObj in configFormat
  schema: null,      // server-truth schema object or null
  schemaFormat: localStorage.getItem("nacho_schema_format") || "json",
  schemaPristine: "",
  // Editor buffers survive tab switches: on leaving a dirty editor tab the
  // text is stashed here and restored on re-entry (null = no draft).
  drafts: { config: null, schema: null },
  ws: null,
  wsRetry: null,
  activeTab: "config",
  openSnapshot: null, // revision expanded inline in the history table
};
let configEd = null;  // code editor for the config tab
let schemaEd = null;  // code editor for the schema tab

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ----- Theme --------------------------------------------------------- */
const THEME_ICONS = {
  light: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6 7 7m10 10 1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/><circle cx="12" cy="12" r="3.5"/></svg>',
  dark: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.1A8 8 0 0 1 8.9 4a8.1 8.1 0 1 0 11.1 11.1Z"/></svg>',
};

function effectiveTheme() {
  const stored = localStorage.getItem("nacho_theme");
  if (stored === "light" || stored === "dark") return stored;
  return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}

function paintTheme() {
  const theme = effectiveTheme();
  document.documentElement.dataset.theme = theme;
  const btn = $("theme-btn");
  if (!btn) return;
  const next = theme === "dark" ? "light" : "dark";
  btn.innerHTML = THEME_ICONS[next];
  btn.setAttribute("aria-label", "Use " + next + " theme");
  btn.title = "Use " + next + " theme";
}

function toggleTheme() {
  const next = effectiveTheme() === "dark" ? "light" : "dark";
  localStorage.setItem("nacho_theme", next);
  paintTheme();
}

/* ----- Desktop navigator -------------------------------------------- */
function paintNav() {
  const desktop = matchMedia("(min-width: 880px)").matches;
  const collapsed = desktop && localStorage.getItem("nacho_nav") === "collapsed";
  const view = $("app-view"), btn = $("nav-toggle");
  if (!view || !btn) return;
  view.classList.toggle("nav-collapsed", collapsed);
  btn.setAttribute("aria-expanded", collapsed ? "false" : "true");
  const label = collapsed ? "Show app navigation" : "Hide app navigation";
  btn.setAttribute("aria-label", label);
  btn.title = label;
}

function toggleNav() {
  const collapsed = !$("app-view").classList.contains("nav-collapsed");
  localStorage.setItem("nacho_nav", collapsed ? "collapsed" : "expanded");
  paintNav();
}

/* ----- Time ---------------------------------------------------------- */
/* Revision logs were printing raw ISO-8601 with microseconds, where five
   consecutive writes differ only in the 20th character. Lead with elapsed
   time (the thing anyone actually reads) and keep the exact stamp on hover. */
const RTF = typeof Intl !== "undefined" && Intl.RelativeTimeFormat
  ? new Intl.RelativeTimeFormat(undefined, { numeric: "auto" })
  : null;
const REL_STEPS = [
  [60, "second", 1],
  [3600, "minute", 60],
  [86400, "hour", 3600],
  [604800, "day", 86400],
  [2629800, "week", 604800],
  [31557600, "month", 2629800],
  [Infinity, "year", 31557600],
];

function relTime(iso) {
  const t = Date.parse(iso);
  if (!iso || isNaN(t)) return "";
  const secs = (t - Date.now()) / 1000;
  const abs = Math.abs(secs);
  if (abs < 45) return "just now";
  for (const [limit, unit, div] of REL_STEPS) {
    if (abs < limit) {
      const v = Math.round(secs / div);
      return RTF ? RTF.format(v, unit)
        : Math.abs(v) + " " + unit + (Math.abs(v) === 1 ? "" : "s") + " ago";
    }
  }
  return "";
}

/* Compact form for the sidebar, where 248px leaves no room for prose. */
function relShort(iso) {
  const t = Date.parse(iso);
  if (!iso || isNaN(t)) return "";
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 60) return "now";
  if (s < 3600) return Math.round(s / 60) + "m";
  if (s < 86400) return Math.round(s / 3600) + "h";
  if (s < 604800) return Math.round(s / 86400) + "d";
  if (s < 31557600) return Math.round(s / 604800) + "w";
  return Math.round(s / 31557600) + "y";
}

function absTime(iso) {
  const t = Date.parse(iso);
  if (!iso || isNaN(t)) return String(iso || "");
  try {
    return new Date(t).toLocaleString(undefined, {
      year: "numeric", month: "short", day: "numeric",
      hour: "2-digit", minute: "2-digit", second: "2-digit",
    });
  } catch (_) { return String(iso); }
}

const EMPTY_MAIN =
  '<div class="empty-state">' +
  '<svg class="arch" width="40" height="40" aria-hidden="true"><use href="#nacho-arch"/></svg>' +
  "<p>Choose an app to view its configuration.</p>" +
  '<p><button class="link" id="empty-new-btn">Create a new app</button></p></div>';

/* EMPTY_MAIN carries a button, so every place that paints it must bind it. */
function showEmptyMain() {
  $("content").innerHTML = EMPTY_MAIN;
  const b = $("empty-new-btn");
  if (b) b.onclick = () => openNewAppModal();
}

/* ===================================================================== */
/* HTTP helper                                                            */
/* ===================================================================== */
async function api(method, path, body) {
  const headers = {};
  if (body !== undefined) headers["Content-Type"] = "application/json";
  if (state.apiKey) headers["Authorization"] = "Bearer " + state.apiKey;
  const resp = await fetch(BASE + path, {
    method,
    headers,
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  let payload = null;
  const text = await resp.text();
  if (text) { try { payload = JSON.parse(text); } catch (_) { payload = text; } }
  if (!resp.ok) {
    const err = new Error("Request failed");
    err.status = resp.status;
    err.detail = payload && payload.detail !== undefined ? payload.detail : payload;
    throw err;
  }
  return { data: payload, headers: resp.headers };
}

function errText(err) {
  // 401 and 403 are different problems and need different advice: a rejected
  // key is fixable by signing in again, a read-only server is not.
  if (err.status === 401) return "Your API key was rejected. Check the key, then sign in again.";
  if (err.status === 403) {
    return "This server is running in read-only mode, so configuration can be " +
      "viewed but not changed.";
  }
  const d = err.detail;
  if (d == null) {
    return err.status
      ? "Something went wrong on the server. Try again, or check the server logs."
      : "Couldn't reach the server. Check your connection and try again.";
  }
  if (typeof d === "string") return d;
  if (d.error === "revision_conflict")
    return "Someone else saved this app first. It's now at r" + d.actual +
      "; your edits are based on r" + d.expected + ".";
  return "Something went wrong on the server. Try again, or check the server logs.";
}

/* Schema violations arrive newline-separated and path-prefixed
   ("rate_limit.per_minute: 0 is less than the minimum of 1"). Render them as
   a list with the path set apart, never as one run-on paragraph. */
function errorList(detail) {
  const lines = String(detail == null ? "" : detail)
    .split("\n").map((l) => l.trim()).filter(Boolean);
  if (!lines.length) return "";
  return "<ul>" + lines.map((line) => {
    const m = line.match(/^([^:\s][^:]*):\s*(.+)$/);
    if (!m) return "<li>" + esc(line) + "</li>";
    const path = m[1] === "root" ? "(top level)" : m[1];
    return '<li><code class="err-path">' + esc(path) + "</code> " + esc(m[2]) + "</li>";
  }).join("") + "</ul>";
}

function problemCount(detail) {
  return String(detail == null ? "" : detail)
    .split("\n").map((l) => l.trim()).filter(Boolean).length;
}

/* ----- Format conversion (json / yaml / toml), handled server-side ----- */
async function convertFormat(data, from, to) {
  if (from === to && typeof data === "string") return data;
  const { data: res } = await api("POST", "/api/convert", { data: data, from: from, to: to });
  return res.data;
}
async function serialize(obj, fmt) {
  if (fmt === "json") return JSON.stringify(obj, null, 2);
  return convertFormat(obj, "json", fmt);
}
async function serializeSafe(obj, fmt, label) {
  try { return { text: await serialize(obj, fmt), fmt: fmt }; }
  catch (_) {
    toast("Cannot show " + label + " as " + fmt.toUpperCase() + " — showing JSON instead.");
    return { text: JSON.stringify(obj, null, 2), fmt: "json" };
  }
}

/* ===================================================================== */
/* Cookie (needed so the WebSocket handshake can authenticate)             */
/* ===================================================================== */
/* The value is URL-encoded so keys containing `;`, `,`, or spaces survive the
   cookie grammar; the server (auth.py) decodes before comparing. `Secure` is
   added when served over HTTPS. */
function setAuthCookie(key) {
  const secure = location.protocol === "https:" ? "; Secure" : "";
  document.cookie = "NACHO_api_key=" + encodeURIComponent(key) +
    "; path=" + COOKIE_PATH + "; SameSite=Strict" + secure;
}
function clearAuthCookie() {
  const secure = location.protocol === "https:" ? "; Secure" : "";
  document.cookie = "NACHO_api_key=; path=" + COOKIE_PATH + "; Max-Age=0; SameSite=Strict" + secure;
}

/* ===================================================================== */
/* Toast                                                                  */
/* ===================================================================== */
let toastTimer = null;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ===================================================================== */
/* Notices — editorial rule-notices; success auto-dismisses after 4s      */
/* ===================================================================== */
function notice(kind, html) {
  const role = kind === "error" ? ' role="alert"' : "";
  return '<div class="notice ' + kind + '"' + role + ">" + html + "</div>";
}
const noticeTimers = {};
function slotNotice(id, html, autoDismiss) {
  const n = $(id);
  if (!n) return;
  clearTimeout(noticeTimers[id]);
  n.innerHTML = html || "";
  if (autoDismiss && html) {
    noticeTimers[id] = setTimeout(() => { if (n.isConnected) n.innerHTML = ""; }, 4000);
  }
}
function configNotice(html, autoDismiss) { slotNotice("config-notice", html, autoDismiss); }
function schemaNotice(html, autoDismiss) { slotNotice("schema-notice", html, autoDismiss); }

/* ===================================================================== */
/* Syntax highlighting — json / yaml / toml                                */
/* ===================================================================== */
function escHtml(s) {
  return s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

function highlightJSON(src) {
  return escHtml(src).replace(
    /("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false|null)\b|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g,
    (m, str, colon, kw, num) => {
      if (str !== undefined) {
        const cls = colon ? "tok-key" : "tok-str";
        return '<span class="' + cls + '">' + str + "</span>" + (colon || "");
      }
      if (kw !== undefined) return '<span class="tok-kw">' + kw + "</span>";
      return '<span class="tok-num">' + num + "</span>";
    }
  );
}

// Highlight a scalar fragment (already HTML-escaped): strings, keywords, numbers.
function highlightScalar(v) {
  return v.replace(
    /("(?:\\.|[^"\\])*"|'[^']*')|\b(true|false|null|yes|no)\b|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/gi,
    (m, str, kw, num) => {
      if (str !== undefined) return '<span class="tok-str">' + str + "</span>";
      if (kw !== undefined) return '<span class="tok-kw">' + kw + "</span>";
      return '<span class="tok-num">' + num + "</span>";
    }
  );
}

function highlightYAML(src) {
  return escHtml(src).split("\n").map((line) => {
    let m = line.match(/^(\s*)(#.*)$/);
    if (m) return m[1] + '<span class="tok-comment">' + m[2] + "</span>";
    m = line.match(/^(\s*(?:-\s+)?)([^:#\s][^:#]*?)(:)(\s.*|)$/);
    if (m) return m[1] + '<span class="tok-key">' + m[2] + "</span>" + m[3] + highlightScalar(m[4]);
    m = line.match(/^(\s*-\s+)(.*)$/);
    if (m) return m[1] + highlightScalar(m[2]);
    return highlightScalar(line);
  }).join("\n");
}

function highlightTOML(src) {
  return escHtml(src).split("\n").map((line) => {
    let m = line.match(/^(\s*)(#.*)$/);
    if (m) return m[1] + '<span class="tok-comment">' + m[2] + "</span>";
    m = line.match(/^(\s*)(\[\[?[^\]]*\]\]?)(\s*)$/);
    if (m) return m[1] + '<span class="tok-key">' + m[2] + "</span>" + m[3];
    m = line.match(/^(\s*)([A-Za-z0-9_."\-]+)(\s*=\s*)(.*)$/);
    if (m) return m[1] + '<span class="tok-key">' + m[2] + "</span>" + m[3] + highlightScalar(m[4]);
    return highlightScalar(line);
  }).join("\n");
}

function highlight(text, lang) {
  if (lang === "yaml") return highlightYAML(text);
  if (lang === "toml") return highlightTOML(text);
  return highlightJSON(text);
}

/* ===================================================================== */
/* Code editor — transparent textarea over a highlighted backdrop          */
/* ===================================================================== */
function mountCodeEditor(host, opts) {
  opts = opts || {};
  let lang = opts.language || "json";
  const wrap = document.createElement("div");
  wrap.className = "code-wrap" + (opts.variant ? " " + opts.variant : "");
  const pre = document.createElement("pre");
  pre.className = "code-hl";
  pre.setAttribute("aria-hidden", "true");
  const code = document.createElement("code");
  pre.appendChild(code);
  const lines = document.createElement("div");
  lines.className = "code-lines";
  lines.setAttribute("aria-hidden", "true");
  const ta = document.createElement("textarea");
  ta.className = "code-input";
  ta.spellcheck = false;
  ta.autocapitalize = "off";
  ta.setAttribute("autocomplete", "off");
  if (opts.ariaLabel) ta.setAttribute("aria-label", opts.ariaLabel);
  if (opts.readOnly) ta.readOnly = true;
  wrap.append(pre, lines, ta);
  host.appendChild(wrap);

  // Describe the tab-capture escape hatch to sighted and AT users alike.
  // (Named escHint, not esc — `esc` is the global HTML-escaping helper.)
  const HINT = "<kbd>Tab</kbd> indents. Press <kbd>Esc</kbd>, then " +
    "<kbd>Tab</kbd>, to move to the next control.";
  const escHint = document.createElement("p");
  escHint.className = "code-esc";
  escHint.id = (host.id || "code") + "-esc";
  escHint.innerHTML = HINT;
  host.appendChild(escHint);
  ta.setAttribute("aria-describedby", escHint.id);

  const render = () => {
    code.innerHTML = highlight(ta.value, lang) + "\n";
    const count = Math.max(1, ta.value.split("\n").length);
    lines.textContent = Array.from({ length: count }, (_, i) => i + 1).join("\n");
  };
  const sync = () => {
    pre.scrollTop = ta.scrollTop; pre.scrollLeft = ta.scrollLeft;
    lines.scrollTop = ta.scrollTop;
  };

  ta.addEventListener("input", () => {
    render(); sync();
    if (opts.onInput) opts.onInput();
  });
  ta.addEventListener("scroll", sync);
  // Tab capture: while armed, Tab indents. Escape disarms it so the next Tab
  // moves focus out — without this the editor is an inescapable keyboard trap
  // (WCAG 2.1.2). Re-arms on every fresh focus so indenting stays the default.
  let tabCaptured = true;
  ta.addEventListener("focus", () => {
    wrap.classList.add("focus");
    tabCaptured = true;
    escHint.innerHTML = HINT;
  });
  ta.addEventListener("blur", () => wrap.classList.remove("focus"));
  ta.addEventListener("keydown", (e) => {
    // Cmd/Ctrl+S saves — scoped to the editor textarea, never global.
    if ((e.metaKey || e.ctrlKey) && (e.key === "s" || e.key === "S")) {
      e.preventDefault();
      if (opts.onSave) opts.onSave();
      return;
    }
    if (e.key === "Escape" && tabCaptured) {
      // Swallow it so the global handler does not also close a dialog.
      e.stopPropagation();
      tabCaptured = false;
      escHint.textContent = "Tab now moves to the next control.";
      return;
    }
    if (e.key !== "Tab") return;
    // Shift+Tab always escapes, and Tab escapes once disarmed.
    if (e.shiftKey || !tabCaptured) return;
    e.preventDefault();
    ta.setRangeText("  ", ta.selectionStart, ta.selectionEnd, "end");
    ta.dispatchEvent(new Event("input"));
  });

  ta.value = opts.value || "";
  render();

  return {
    textarea: ta,
    get value() { return ta.value; },
    set value(v) { ta.value = v; render(); sync(); },
    setLanguage(l) { lang = l; render(); },
    focus() { ta.focus(); },
  };
}

/* ===================================================================== */
/* Format switcher — visually-hidden radios + styled labels                */
/* ===================================================================== */
function fmtSwitcher(prefix, sel) {
  let html = '<span class="fmt-group" role="radiogroup" aria-label="Editor format">';
  FORMATS.forEach((f, i) => {
    if (i) html += '<span class="sep">·</span>';
    html += '<input type="radio" class="fmt-radio" name="' + prefix + '" id="' +
      prefix + "-" + f + '" value="' + f + '"' + (f === sel ? " checked" : "") + ">" +
      '<label class="fmt-opt" for="' + prefix + "-" + f + '">' + f.toUpperCase() + "</label>";
  });
  return html + "</span>";
}
function bindFmtSwitcher(prefix, handler) {
  document.querySelectorAll('input[name="' + prefix + '"]').forEach((r) => {
    r.onchange = () => handler(r.value);
  });
}
function setFmtSwitcher(prefix, fmt) {
  const r = $(prefix + "-" + fmt);
  if (r) r.checked = true;
}

/* ===================================================================== */
/* Connect flow                                                           */
/* ===================================================================== */
async function boot() {
  let health = {};
  try {
    const r = await fetch(BASE + "/health");
    health = await r.json();
  } catch (_) { /* server may still be coming up */ }
  state.authRequired = health.auth_required !== false;
  state.readOnly = !!health.read_only;
  const ver = health.version ? "v" + health.version : "";
  $("server-ver").textContent = ver;
  $("signin-ver").textContent = ver;
  // Signing out only has meaning when the server authenticates requests.
  // On an open server it led to a dead-end API-key form that accepted any key.
  $("disconnect-btn").classList.toggle("hidden", !state.authRequired);
  $("auth-divider").classList.toggle("hidden", !state.authRequired);

  if (!state.authRequired) { state.apiKey = ""; await enterApp(); return; }
  if (state.apiKey && (await tryConnect())) return;
  showConnect();
}

function showConnect() {
  $("connect-view").classList.remove("hidden");
  $("app-view").classList.add("hidden");
  $("key-input").value = state.apiKey;
  $("key-input").focus();
}

async function tryConnect() {
  try {
    await api("GET", "/api/apps");
    await enterApp();
    return true;
  } catch (err) {
    if (err.status === 401 || err.status === 403) return false;
    $("connect-error").textContent = errText(err);
    return false;
  }
}

$("connect-btn").onclick = async () => {
  const btn = $("connect-btn");
  const key = $("key-input").value.trim();
  $("connect-error").textContent = "";
  if (!key) { $("connect-error").textContent = "API key is required."; return; }
  btn.disabled = true;
  try {
    state.apiKey = key;
    setAuthCookie(key);
    if (await tryConnect()) {
      localStorage.setItem("nacho_api_key", key);
    } else if (!$("connect-error").textContent) {
      $("connect-error").textContent = "Invalid API key.";
    }
  } finally {
    btn.disabled = false;
  }
};
$("key-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") $("connect-btn").click();
});

$("disconnect-btn").onclick = async () => {
  if (!(await confirmDiscard())) return;
  closeWs();
  clearInterval(state.appsPoll);
  state.apiKey = "";
  state.selected = null;
  clearDrafts();
  localStorage.removeItem("nacho_api_key");
  clearAuthCookie();
  showConnect();
};

async function enterApp() {
  if (state.apiKey) setAuthCookie(state.apiKey);
  $("connect-view").classList.add("hidden");
  $("app-view").classList.remove("hidden");
  $("ro-badge").classList.toggle("hidden", !state.readOnly);
  $("new-app-btn").classList.toggle("hidden", state.readOnly);
  if (!state.selected) showEmptyMain();
  try {
    await refreshApps();
  } catch (err) {
    $("app-list").innerHTML = notice("error", esc(errText(err)));
  }
  // Keep the index (revisions, other apps) reasonably fresh.
  clearInterval(state.appsPoll);
  state.appsPoll = setInterval(() => refreshApps().catch(() => {}), 30000);
}

/* ===================================================================== */
/* App index                                                              */
/* ===================================================================== */
async function refreshApps() {
  const { data } = await api("GET", "/api/apps");
  state.apps = data.data || {};
  if (state.selected && !state.apps[state.selected]) {
    // The selected app was deleted or renamed elsewhere — drop the stale pane.
    state.selected = null;
    clearDrafts();
    closeWs();
    showEmptyMain();
  }
  renderAppList();
}

function renderAppList() {
  const list = $("app-list");
  const all = Object.keys(state.apps).sort();
  const count = $("app-count");
  if (count) count.textContent = all.length;
  const filterEl = $("app-filter");
  const q = (filterEl ? filterEl.value : "").trim().toLowerCase();
  if (!all.length) {
    setFilterVisible(false);
    list.innerHTML = '<div class="index-empty">' +
      '<svg class="arch" width="24" height="24" aria-hidden="true"><use href="#nacho-arch"/></svg>' +
      "<p>No apps yet.</p>" +
      '<button class="link" id="first-app-btn">Create your first app</button></div>';
    $("first-app-btn").onclick = () => openNewAppModal();
    return;
  }
  // The filter earns its place once scanning by eye stops working.
  setFilterVisible(all.length >= 8);
  const names = q
    ? all.filter((n) => n.toLowerCase().includes(q) ||
        String((state.apps[n] || {}).description || "").toLowerCase().includes(q))
    : all;
  list.innerHTML = "";
  if (!names.length) {
    list.innerHTML = '<p class="filter-empty">No app matches “' + esc(q) + '”.</p>';
    return;
  }
  for (const name of names) {
    const info = state.apps[name];
    const conn = info.connections || 0;
    const age = relShort(info.updated_at);
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "app-item" + (name === state.selected ? " active" : "");
    // "Which app is selected" was carried by colour and weight alone.
    if (name === state.selected) btn.setAttribute("aria-current", "true");
    const parts = ["revision " + info.revision];
    if (info.updated_at) parts.push("changed " + relTime(info.updated_at));
    parts.push(conn === 1 ? "1 client connected" : conn + " clients connected");
    btn.title = parts.join(" · ");
    // Elapsed time ranks across apps; a revision number does not.
    // The connection count is omitted at zero — absence is the quiet state.
    btn.innerHTML = '<span class="app-copy"><span class="app-name">' + esc(name) + "</span>" +
      '<span class="app-desc">' + esc(info.description || "No description") + "</span></span>" +
      '<span class="app-meta"><span class="app-rev">r' + esc(info.revision) + "</span>" +
      '<span>' + (conn ? esc(conn) + " online · " : "") + esc(age) + "</span></span>" +
      '<span class="sr-only">' + esc(parts.join(", ")) + "</span>";
    btn.onclick = () => selectApp(name);
    list.appendChild(btn);
  }
}

function setFilterVisible(on) {
  const wrap = $("index-filter");
  if (!wrap) return;
  wrap.hidden = !on;
}

/* ===================================================================== */
/* App detail                                                             */
/* ===================================================================== */
function clearDrafts() {
  state.drafts = { config: null, schema: null };
  configEd = null;
  schemaEd = null;
  // A revision's snapshot is immutable, but an app deleted and recreated under
  // the same name restarts numbering — so the cache never outlives a reload.
  snapCache.clear();
}

async function selectApp(name) {
  if (state.selected === name) return;
  if (!(await confirmDiscard())) return;
  clearDrafts();
  state.selected = name;
  renderAppList();
  await loadAppDetail(name);
  openWs(name);
}

async function loadAppDetail(name) {
  let configObj, schemaObj;
  try {
    const cfg = await api("GET", "/api/apps/" + encodeURIComponent(name) + "/config");
    configObj = cfg.data;
    state.generation = cfg.headers.get("X-Nacho-Generation") || state.generation;
    state.revision = parseInt(cfg.headers.get("X-Nacho-Revision"), 10) || state.apps[name]?.revision || 1;
    const sch = await api("GET", "/api/apps/" + encodeURIComponent(name) + "/schema");
    schemaObj = sch.data.data;
  } catch (err) {
    $("content").innerHTML = notice("error", esc(errText(err)));
    return;
  }
  state.configObj = configObj;
  state.schema = schemaObj;
  // A full (re)load is always adopt-server-truth: drafts do not survive it.
  clearDrafts();

  const cfg = await serializeSafe(configObj, state.configFormat, "configuration");
  state.configFormat = cfg.fmt;
  state.pristine = cfg.text;

  if (schemaObj) {
    const sch = await serializeSafe(schemaObj, state.schemaFormat, "schema");
    state.schemaFormat = sch.fmt;
    state.schemaPristine = sch.text;
  } else {
    state.schemaPristine = "";
  }
  renderDetail();
}

function renderDetail() {
  const name = state.selected;
  const info = state.apps[name] || {};
  const wsOn = !!(state.ws && state.ws.readyState === 1);
  // Zero watchers is the permanent state on most apps; a slot that always
  // reads "0 watching" is noise, so absence stays quiet.
  const conns = info.connections || 0;
  const c = $("content");
  c.innerHTML = `
    <header class="detail-head">
      <p class="detail-kicker lbl">Configuration workspace</p>
      <div class="dh-row">
        <h1>${esc(name)}</h1>
        <span class="spacer"></span>
        ${state.readOnly ? "" : `<span class="dh-actions">
          <button class="link" id="meta-btn">Edit</button>
          <span class="sep">·</span>
          <button class="link danger" id="delete-btn">Delete</button>
        </span>`}
      </div>
      <p id="app-description" class="desc${info.description ? "" : " none"}">${esc(info.description || "No description")}</p>
    </header>
    <p class="status-line">
      <span class="st-item live-seg"><span class="live-dot ${wsOn ? "on" : "off"}" id="live-dot"></span><span id="live-label">${wsOn ? "Live" : "Reconnecting…"}</span></span>
      <span class="sep st-sep">·</span>
      <span class="st-item" title="${esc(info.updated_at ? absTime(info.updated_at) : "")}"><span class="st-k">Revision</span> r<span id="rev-label">${esc(state.revision)}</span>${info.updated_at ? ' <span class="st-k">' + esc(relTime(info.updated_at)) + "</span>" : ""}</span>
      <span class="sep st-sep">·</span>
      <span class="st-item" id="schema-flag">${state.schema ? "Schema attached" : '<span class="faint">No schema</span>'}</span>
      ${conns ? '<span class="sep st-sep">·</span><span class="st-item" title="Clients subscribed over WebSocket. They receive each change the moment you save.">' + esc(conns) + (conns === 1 ? " client" : " clients") + " connected</span>" : ""}
    </p>
    <div class="tabs" role="tablist" aria-label="App sections">
      <button class="tab" role="tab" id="tab-btn-config" aria-controls="tab-body" aria-selected="false" tabindex="-1" data-tab="config">Configuration<span class="tab-dot" role="img" aria-label="unsaved changes" hidden></span></button>
      <button class="tab" role="tab" id="tab-btn-schema" aria-controls="tab-body" aria-selected="false" tabindex="-1" data-tab="schema">Schema<span class="tab-dot" role="img" aria-label="unsaved changes" hidden></span></button>
      <button class="tab" role="tab" id="tab-btn-history" aria-controls="tab-body" aria-selected="false" tabindex="-1" data-tab="history">History</button>
    </div>
    <div id="tab-body" role="tabpanel" tabindex="0"></div>
  `;
  $("live-dot").addEventListener("animationend", () => $("live-dot").classList.remove("pulse"));
  if ($("meta-btn")) $("meta-btn").onclick = openMetaModal;
  if ($("delete-btn")) $("delete-btn").onclick = deleteApp;
  // Full APG tabs contract: one tab stop for the whole list (roving tabindex),
  // arrows move AND select so focus never desynchronises from what is shown,
  // Home/End jump to the ends.
  const tabs = Array.from(c.querySelectorAll(".tab"));
  const goTab = (t) => { t.focus(); switchTab(t.dataset.tab); };
  tabs.forEach((t, i) => {
    t.onclick = () => switchTab(t.dataset.tab);
    t.onkeydown = (e) => {
      let next = null;
      if (e.key === "ArrowRight") next = tabs[(i + 1) % tabs.length];
      else if (e.key === "ArrowLeft") next = tabs[(i + tabs.length - 1) % tabs.length];
      else if (e.key === "Home") next = tabs[0];
      else if (e.key === "End") next = tabs[tabs.length - 1];
      if (!next) return;
      e.preventDefault();
      goTab(next);
    };
  });
  switchTab(state.activeTab, true);
}

/* Stash a dirty editor's buffer before its tab is torn down. */
function stashDrafts() {
  if (configEd) state.drafts.config = isConfigDirty() ? configEd.value : null;
  if (schemaEd) state.drafts.schema = isSchemaDirty() ? schemaEd.value : null;
}

function switchTab(tab, force) {
  // Re-clicking the already-active tab must not re-render from pristine —
  // that would silently discard unsaved edits. `force` is used after a full
  // detail re-render, when the tab body is empty and must be rebuilt.
  if (!force && tab === state.activeTab) return;
  // Tab switches never prompt: dirty buffers are preserved as drafts and
  // restored on re-entry. Discard only happens on app switch / Discard /
  // Load-server-version / sign-out.
  stashDrafts();
  state.activeTab = tab;
  configEd = null;
  schemaEd = null;
  document.querySelectorAll(".tab").forEach((t) => {
    const on = t.dataset.tab === tab;
    t.classList.toggle("active", on);
    t.setAttribute("aria-selected", on ? "true" : "false");
    t.tabIndex = on ? 0 : -1;
  });
  const panel = $("tab-body");
  if (panel) panel.setAttribute("aria-labelledby", "tab-btn-" + tab);
  if (tab === "config") renderConfigTab();
  else if (tab === "history") renderHistoryTab();
  else renderSchemaTab();
  updateTabDots();
}
