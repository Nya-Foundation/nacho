<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nacho — Configuration Manager</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20512%20512'%3E%3Crect%20width='512'%20height='512'%20rx='116'%20fill='%231E1E1B'/%3E%3Cpath%20d='M%20118%20388%20L%20118%20234%20A%2092%2092%200%200%201%20302%20234%20L%20302%20388%20L%20244%20388%20L%20244%20234%20A%2034%2034%200%200%200%20176%20234%20L%20176%20388%20Z'%20fill='%23F6F6F3'/%3E%3Ccircle%20cx='372'%20cy='342'%20r='46'%20fill='%23D6892A'/%3E%3C/svg%3E" />
<style>
/* ===================================================================== */
/* Design tokens — "Paper & Dot". Light is the primary canvas.            */
/* ===================================================================== */
:root {
  --paper: #F6F6F3;
  --sheet: #FFFFFF;
  --ink: #1E1E1B;
  --ink-strong: #141412;
  --muted: #75756B;
  --faint: #B9B9AE;
  --rule: #E4E3DB;
  --rule-strong: #CFCEC4;
  --hover: color-mix(in srgb, var(--ink) 4%, transparent);
  --amber: #D6892A;
  --amber-strong: #A8681B;
  --danger: #B3402F;
  --scrim: rgba(30,30,27,.45);
  --c-str: #51785D;
  --c-num: #42688C;
  --c-kw: #84618F;
  --mk-tile: #1E1E1B;
  --mk-n: #F6F6F3;
  --mk-dot: #D6892A;
  --shadow: 0 24px 48px -12px rgba(20,20,18,.25);
  --r-btn: 6px;
  --r-code: 10px;
  --r-modal: 14px;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #1A1A17;
    --sheet: #1E1E1B;
    --ink: #F6F6F3;
    --ink-strong: #FFFFFF;
    --muted: #98988D;
    --faint: #5A5A52;
    --rule: #32322C;
    --rule-strong: #44443C;
    --amber: #E0A44A;
    --amber-strong: #E0A44A;
    --danger: #E06A55;
    --scrim: rgba(0,0,0,.6);
    --c-str: #8AB394;
    --c-num: #84A9CC;
    --c-kw: #B497BE;
    --mk-tile: #F6F6F3;
    --mk-n: #1E1E1B;
    --mk-dot: #E0A44A;
    --shadow: 0 24px 48px -12px rgba(0,0,0,.55);
  }
}

/* ===================================================================== */
/* Base                                                                   */
/* ===================================================================== */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--sans);
  background: var(--paper);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.6;
}
button { font-family: inherit; font-size: 13px; cursor: pointer; color: inherit; }
input, textarea { font-family: inherit; font-size: 13px; color: var(--ink); }
h1, h2, h3 { margin: 0; }
.hidden { display: none !important; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--amber-strong); outline-offset: 2px; }

/* Type utilities */
.lbl {
  font-size: 11px; line-height: 1.2; font-weight: 600;
  letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.mono-data {
  font-family: var(--mono); font-size: 12px; line-height: 1.5;
  font-weight: 450; font-variant-numeric: tabular-nums;
}
.sep { color: var(--faint); }
.faint { color: var(--faint); }
.spacer { flex: 1; }
.hint { font-size: 13px; color: var(--muted); margin: 12px 0 0; }

/* Wordmark — lowercase name + a true circular amber dot */
.wordmark {
  font-weight: 650; letter-spacing: -.022em;
  color: var(--ink-strong); user-select: none; white-space: nowrap;
}
.wm-dot {
  display: inline-block; width: .15em; height: .15em; border-radius: 50%;
  background: var(--amber); margin-left: .09em;
}

/* Brand marks via <use>; symbol fills come from inherited custom props */
.arch { fill: var(--faint); display: block; margin: 0 auto 12px; }

/* ===================================================================== */
/* Ink button (the only button) + text links                              */
/* ===================================================================== */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  height: 28px; padding: 0 14px; border: 0; border-radius: var(--r-btn);
  background: var(--ink); color: var(--paper);
  font-size: 13px; font-weight: 500;
  transition: opacity .12s ease-out;
}
.btn:hover { opacity: .88; }
.btn:active { opacity: .8; }
.btn:disabled { opacity: .4; pointer-events: none; }
.btn.danger { background: var(--danger); color: #fff; }
.btn.armed::before {
  content: ""; width: 5px; height: 5px; border-radius: 50%;
  background: var(--amber); margin-right: 7px; flex: none;
}

.link {
  display: inline-block; border: 0; background: none;
  padding: 6px 4px; margin: -6px -4px;
  font-size: 13px; font-weight: 500; color: var(--muted);
  text-decoration: none; transition: color .12s ease-out;
}
.link:hover {
  color: var(--ink); text-decoration: underline;
  text-underline-offset: 3px; text-decoration-color: var(--rule-strong);
}
.link.danger:hover { color: var(--danger); }
.link:disabled { color: var(--faint); pointer-events: none; }
.link.faint { color: var(--faint); }
.link.faint:hover { color: var(--muted); }
.link:focus-visible { border-radius: 2px; }

/* ===================================================================== */
/* Format switcher — visually-hidden radios + styled text labels          */
/* ===================================================================== */
.fmt-group {
  position: relative; display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: 12px; font-weight: 450;
  font-variant-numeric: tabular-nums;
}
.fmt-radio {
  position: absolute; width: 1px; height: 1px; margin: -1px;
  clip-path: inset(50%); overflow: hidden; white-space: nowrap;
}
.fmt-opt {
  color: var(--muted); cursor: pointer; padding: 6px 2px; margin: -6px 0;
  transition: color .12s ease-out;
}
.fmt-opt:hover { color: var(--ink); }
.fmt-radio:checked + .fmt-opt {
  color: var(--ink-strong); font-weight: 600;
  text-decoration: underline; text-underline-offset: 4px;
  text-decoration-color: var(--rule-strong);
}
.fmt-radio:focus-visible + .fmt-opt {
  outline: 2px solid var(--amber-strong); outline-offset: 2px; border-radius: 2px;
}

/* ===================================================================== */
/* Inputs — prose is written on the page; code sits in a tile             */
/* ===================================================================== */
.u-input {
  display: block; width: 100%; border: 0;
  border-bottom: 1px solid var(--rule-strong);
  background: transparent; padding: 6px 0;
  font-size: 14px; border-radius: 0;
}
.u-input:focus {
  outline: none;
  border-bottom: 2px solid var(--amber-strong); margin-bottom: -1px;
}
.u-input::placeholder { color: var(--faint); }

.box-code {
  display: block; width: 100%;
  border: 1px solid var(--rule-strong); border-radius: var(--r-btn);
  background: var(--sheet);
  font-family: var(--mono); font-size: 12.5px; line-height: 1.65; tab-size: 2;
  padding: 10px 12px; white-space: pre; resize: vertical;
}
.box-code:focus { outline: none; border-color: var(--amber-strong); }
.box-code::placeholder { color: var(--faint); }

/* ===================================================================== */
/* Code editor (transparent textarea over a highlighted backdrop)         */
/* ===================================================================== */
.code-wrap {
  position: relative; height: 360px;
  border: 1px solid var(--rule-strong); border-radius: var(--r-code);
  background: var(--sheet); overflow: hidden;
}
.code-wrap.cfg { height: max(360px, calc(100dvh - 400px)); }
.code-wrap.sch { height: max(320px, calc(100dvh - 430px)); }
.code-wrap.focus { outline: 2px solid var(--amber-strong); outline-offset: -2px; }
.code-hl, .code-input {
  position: absolute; inset: 0; margin: 0; padding: 14px 16px; border: 0;
  font-family: var(--mono); font-size: 12.5px; line-height: 1.65;
  tab-size: 2; white-space: pre;
}
.code-hl { z-index: 0; overflow: hidden; pointer-events: none; color: var(--ink); }
.code-hl code { font: inherit; }
.code-input {
  z-index: 1; overflow: auto; background: transparent;
  color: transparent; caret-color: var(--ink); resize: none;
}
.code-input:focus { outline: none; }
.code-input::selection { background: color-mix(in srgb, var(--amber) 25%, transparent); }
.tok-key { color: var(--ink); font-weight: 600; }
.tok-str { color: var(--c-str); }
.tok-num { color: var(--c-num); }
.tok-kw  { color: var(--c-kw); }
.tok-comment { color: var(--muted); font-style: italic; }

/* ===================================================================== */
/* Sign-in — the title page. Cardless: elements sit directly on paper.    */
/* ===================================================================== */
#connect-view {
  min-height: 100%; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 24px;
  padding-bottom: 10vh;
}
.signin-mark { width: 56px; height: 56px; display: block; }
#connect-view .wordmark { font-size: 32px; line-height: 1.15; margin-top: 24px; }
.signin-sub { font-size: 13px; color: var(--muted); margin: 4px 0 0; }
.signin-col { width: 320px; max-width: 100%; margin-top: 40px; }
.signin-col .lbl { display: block; margin-bottom: 6px; }
.signin-btn { width: 100%; height: 36px; margin-top: 20px; }
.connect-error { font-size: 13px; color: var(--danger); min-height: 20px; margin-top: 12px; }
.signin-ver { margin-top: 32px; text-align: center; color: var(--faint); }

/* ===================================================================== */
/* Shell — one paper surface, regions separated by hairlines              */
/* ===================================================================== */
#app-view { height: 100%; display: flex; flex-direction: column; }
.masthead {
  display: flex; align-items: center; gap: 12px;
  height: 52px; padding: 0 24px; flex: none;
  border-bottom: 1px solid var(--rule);
}
.mast-mark { width: 22px; height: 22px; display: block; }
.masthead .wordmark { font-size: 16px; }
.masthead .ver { color: var(--muted); }
.ro-flag { color: var(--danger); }

.layout { flex: 1; display: flex; min-height: 0; }
.index {
  width: 248px; flex: none; display: flex; flex-direction: column;
  border-right: 1px solid var(--rule); overflow-y: auto;
}
.index-head {
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 20px 24px 8px; flex: none;
}
.app-list { flex: 1; }
.app-item {
  position: relative; display: flex; align-items: center;
  justify-content: space-between; gap: 8px;
  width: 100%; height: 36px; padding: 0 24px;
  border: 0; background: none; text-align: left; font-size: 14px;
}
.app-item:hover { background: var(--hover); }
.app-item .app-name {
  font-weight: 500; color: var(--muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  transition: color .12s ease-out;
}
.app-item:hover .app-name { color: var(--ink); }
.app-item .app-meta {
  font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums;
  color: var(--faint); flex: none;
}
.app-item.active .app-name { color: var(--ink-strong); font-weight: 600; }
.app-item.active .app-meta { color: var(--muted); }
.app-item.active::before {
  content: ""; position: absolute; left: 12px; top: 50%;
  transform: translateY(-50%);
  width: 6px; height: 6px; border-radius: 50%; background: var(--amber);
}
.index-empty {
  text-align: center; margin-top: 24px; padding: 0 16px;
  color: var(--muted); font-size: 13px;
}
.index-empty p { margin: 0 0 8px; }

.content { flex: 1; overflow-y: auto; min-width: 0; }
#content { max-width: 880px; padding: 40px 48px 96px; }
.empty-state { text-align: center; margin-top: 96px; color: var(--muted); font-size: 13px; }
.empty-state p { margin: 0; }

/* ===================================================================== */
/* App detail header + status line                                        */
/* ===================================================================== */
.dh-row { display: flex; align-items: baseline; gap: 12px; }
.detail-head h1 {
  font-size: 24px; line-height: 1.2; font-weight: 650;
  letter-spacing: -.02em; color: var(--ink-strong);
  overflow-wrap: anywhere;
}
.dh-actions { display: flex; align-items: baseline; gap: 8px; flex: none; }
.desc { margin: 4px 0 0; color: var(--muted); }
.desc.none { color: var(--faint); font-style: italic; }
.status-line {
  display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
  margin: 12px 0 0;
  font-family: var(--mono); font-size: 12px; font-weight: 450;
  font-variant-numeric: tabular-nums; color: var(--muted);
}
.live-seg { display: inline-flex; align-items: center; gap: 6px; }
.live-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.live-dot.on { background: var(--amber); }
.live-dot.off {
  background: transparent;
  box-shadow: inset 0 0 0 1.5px var(--muted);
  animation: recon 1.6s ease-in-out infinite;
}
.live-dot.on.pulse { animation: halo .9s ease-out 2; }
@keyframes halo {
  from { box-shadow: 0 0 0 0 color-mix(in srgb, var(--amber) 35%, transparent); }
  to   { box-shadow: 0 0 0 6px transparent; }
}
@keyframes recon { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

/* ===================================================================== */
/* Tabs — running heads on the hairline; the dot is the active marker     */
/* ===================================================================== */
.tabs { display: flex; gap: 28px; margin-top: 24px; border-bottom: 1px solid var(--rule); }
.tab {
  position: relative; border: 0; background: none; padding: 8px 0;
  font-size: 13px; font-weight: 500; color: var(--muted);
  transition: color .12s ease-out;
}
.tab:hover { color: var(--ink); }
.tab.active { color: var(--ink-strong); font-weight: 600; }
.tab.active::after {
  content: ""; position: absolute; left: 50%; bottom: -3px;
  transform: translateX(-50%);
  width: 5px; height: 5px; border-radius: 50%; background: var(--amber);
}
.tab-dot {
  display: inline-block; width: 5px; height: 5px; border-radius: 50%;
  background: var(--amber); margin-left: 6px; vertical-align: 2px;
}

/* ===================================================================== */
/* Editor toolbar                                                         */
/* ===================================================================== */
.toolbar { display: flex; align-items: center; gap: 16px; margin: 16px 0 12px; }
.ed-status { display: inline-flex; align-items: center; gap: 8px; }
.ed-status .status-text { color: var(--faint); }
.ed-status .status-text.dirty { color: var(--muted); }
.sdot { color: var(--amber); }

/* ===================================================================== */
/* Notices — editorial rules, not boxes                                   */
/* ===================================================================== */
.notice {
  border-left: 2px solid var(--rule-strong);
  padding: 6px 14px; margin-bottom: 12px;
  font-size: 13px; color: var(--ink);
}
.notice.error {
  border-left-color: var(--danger);
  background: color-mix(in srgb, var(--danger) 6%, transparent);
  border-radius: 0 6px 6px 0;
}
.notice.warn {
  border-left-color: var(--amber);
  background: color-mix(in srgb, var(--amber) 6%, transparent);
  border-radius: 0 6px 6px 0;
}
.notice ul { margin: 4px 0 0; padding-left: 18px; color: var(--muted); }
.notice .link { margin-left: 4px; }

/* ===================================================================== */
/* History — a typeset table                                              */
/* ===================================================================== */
.history-wrap { overflow-x: auto; }
.history-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.history-table th {
  text-align: left; padding: 8px 12px 8px 0;
  border-bottom: 1px solid var(--rule-strong);
  font-size: 11px; font-weight: 600; letter-spacing: .08em;
  text-transform: uppercase; color: var(--muted);
}
.history-table td {
  text-align: left; padding: 10px 12px 10px 0;
  border-bottom: 1px solid var(--rule);
}
.history-table tbody tr:hover { background: var(--hover); }
.history-table tbody tr.snap-row:hover { background: none; }
.cur-dot {
  display: inline-block; width: 5px; height: 5px; border-radius: 50%;
  background: var(--amber); margin-left: 6px; vertical-align: 1px;
}
.cur-txt { color: var(--muted); }
.schema-col { color: var(--muted); }
.row-actions { text-align: right; white-space: nowrap; }
.row-actions .link + .link { margin-left: 16px; }
.snap-row td { padding: 8px 0 16px; }
.snap-head { font-family: var(--mono); font-size: 12px; color: var(--muted); margin: 0 0 8px; }
.snap-pre {
  margin: 0; background: var(--sheet);
  border: 1px solid var(--rule); border-radius: var(--r-code);
  padding: 12px 14px; font-family: var(--mono); font-size: 12.5px;
  line-height: 1.65; overflow: auto; max-height: 320px;
}
.hist-empty { color: var(--muted); font-size: 13px; }

/* ===================================================================== */
/* Modal                                                                  */
/* ===================================================================== */
#modal-overlay {
  position: fixed; inset: 0; z-index: 1000;
  background: var(--scrim); backdrop-filter: blur(2px);
  display: flex; align-items: center; justify-content: center; padding: 20px;
  animation: fadein .16s ease-out;
}
.modal {
  background: var(--sheet);
  border: 1px solid var(--rule); border-radius: var(--r-modal);
  width: 440px; max-width: calc(100vw - 40px);
  max-height: 90vh; overflow-y: auto; padding: 24px;
  box-shadow: var(--shadow);
  animation: sheetin .18s ease-out;
}
.modal h3 {
  font-size: 18px; line-height: 1.3; font-weight: 650;
  letter-spacing: -.015em; color: var(--ink-strong); margin-bottom: 20px;
}
@keyframes fadein { from { opacity: 0; } }
@keyframes sheetin { from { opacity: 0; transform: scale(.985); } }
.field { margin-bottom: 16px; }
.field > .lbl { display: block; margin-bottom: 6px; }
.field-head {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 6px;
}
.field-head .lbl { margin-bottom: 0; }
.field-hint { font-size: 12px; color: var(--faint); margin: 6px 0 0; }
.opt { color: var(--faint); }
.confirm-body { font-size: 13px; color: var(--muted); margin: 0; }
.modal-error { font-size: 13px; color: var(--danger); min-height: 18px; margin-top: 4px; }
.modal-actions {
  display: flex; justify-content: flex-end; align-items: center;
  gap: 16px; margin-top: 24px;
}

/* ===================================================================== */
/* Toast                                                                  */
/* ===================================================================== */
#toast {
  position: fixed; bottom: 24px; left: 50%; z-index: 1100;
  transform: translateX(-50%) translateY(6px);
  background: var(--ink); color: var(--paper);
  padding: 10px 18px; border-radius: 8px; font-size: 13px;
  box-shadow: var(--shadow);
  opacity: 0; transition: opacity .2s, transform .2s;
  pointer-events: none;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ===================================================================== */
/* Responsive                                                             */
/* ===================================================================== */
@media (max-width: 879px) {
  .layout { flex-direction: column; }
  .index {
    width: 100%; height: 44px; flex: none;
    flex-direction: row; align-items: stretch;
    border-right: 0; border-bottom: 1px solid var(--rule);
    overflow-y: hidden; overflow-x: auto;
  }
  .index-head {
    order: 2; margin-left: auto; padding: 0 16px;
    align-items: center; flex: none;
  }
  .index-head .lbl { display: none; }
  .app-list { order: 1; display: flex; align-items: stretch; flex: none; }
  .app-item { width: auto; height: auto; padding: 0 14px; }
  .app-item .app-meta { display: none; }
  .app-item.active::before { left: 3px; }
  .index-empty { margin: 0; display: flex; align-items: center; gap: 8px; padding: 0 16px; }
  .index-empty .arch { display: none; }
  .index-empty p { margin: 0; }
  #content { padding: 24px 20px 64px; }
}
@media (max-width: 559px) {
  .masthead .ver { display: none; }
  .dh-row { flex-wrap: wrap; }
  .toolbar { flex-wrap: wrap; row-gap: 12px; }
  .code-wrap.cfg, .code-wrap.sch { height: max(320px, calc(100dvh - 430px)); }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<!-- Brand symbols: the mark, and the dotless arch for empty states -->
<svg width="0" height="0" aria-hidden="true" style="position:absolute">
  <symbol id="nacho-mark" viewBox="0 0 512 512">
    <rect width="512" height="512" rx="116" fill="var(--mk-tile)"/>
    <path d="M 118 388 L 118 234 A 92 92 0 0 1 302 234 L 302 388 L 244 388 L 244 234 A 34 34 0 0 0 176 234 L 176 388 Z" fill="var(--mk-n)"/>
    <circle cx="372" cy="342" r="46" fill="var(--mk-dot)"/>
  </symbol>
  <symbol id="nacho-arch" viewBox="0 0 512 512">
    <path d="M 118 388 L 118 234 A 92 92 0 0 1 302 234 L 302 388 L 244 388 L 244 234 A 34 34 0 0 0 176 234 L 176 388 Z"/>
  </symbol>
</svg>

<!-- ===================== Sign-in ("the title page") ===================== -->
<div id="connect-view">
  <svg class="signin-mark" aria-hidden="true"><use href="#nacho-mark"/></svg>
  <div class="wordmark">nacho<span class="wm-dot"></span></div>
  <p class="signin-sub">Schema-first configuration.</p>
  <div class="signin-col">
    <label class="lbl" for="key-input">API key</label>
    <input id="key-input" class="u-input" type="password" autocomplete="off" autofocus />
    <button id="connect-btn" class="btn signin-btn">Sign in</button>
    <div id="connect-error" class="connect-error"></div>
    <div class="signin-ver mono-data" id="signin-ver"></div>
  </div>
</div>

<!-- ===================== App view ===================== -->
<div id="app-view" class="hidden">
  <header class="masthead">
    <svg class="mast-mark" aria-hidden="true"><use href="#nacho-mark"/></svg>
    <span class="wordmark">nacho<span class="wm-dot"></span></span>
    <span class="ver mono-data" id="server-ver"></span>
    <span class="spacer"></span>
    <span class="ro-flag lbl hidden" id="ro-badge">Read-only</span>
    <button class="link" id="disconnect-btn">Sign out</button>
  </header>
  <div class="layout">
    <aside class="index">
      <div class="index-head">
        <span class="lbl">Apps</span>
        <button class="link" id="new-app-btn">+ New</button>
      </div>
      <div class="app-list" id="app-list"></div>
    </aside>
    <main class="content">
      <div id="content"></div>
    </main>
  </div>
</div>

<div id="modal-overlay" class="hidden"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ===================================================================== */
/* Mount base — derived from where the UI was served, so the same bundle  */
/* works whether the orchestrator is mounted at "/" or under a subpath    */
/* such as "/config". At "/ui" → BASE = ""; at "/config/ui" → "/config".  */
/* ===================================================================== */
const BASE = location.pathname.replace(/\/ui\/?$/, "");
const COOKIE_PATH = BASE || "/";

/* ===================================================================== */
/* State                                                                  */
/* ===================================================================== */
const FORMATS = ["json", "yaml", "toml"];
const state = {
  apiKey: localStorage.getItem("nacho_api_key") || "",
  authRequired: true,
  readOnly: false,
  apps: {},          // name -> info
  selected: null,    // app name
  revision: null,
  configObj: {},     // server-truth config object
  configFormat: localStorage.getItem("nacho_config_format") || "json",
  pristine: "",      // editor text of configObj in configFormat
  schema: null,      // server-truth schema object or null
  schemaFormat: localStorage.getItem("nacho_schema_format") || "json",
  schemaPristine: "",
  // Editor buffers survive tab switches: on leaving a dirty editor tab the
  // text is stashed here and restored on re-entry (null = no draft).
  drafts: { config: null, schema: null },
  ws: null,
  wsRetry: null,
  activeTab: "config",
  openSnapshot: null, // revision expanded inline in the history table
};
let configEd = null;  // code editor for the config tab
let schemaEd = null;  // code editor for the schema tab

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const EMPTY_MAIN =
  '<div class="empty-state">' +
  '<svg class="arch" width="40" height="40" aria-hidden="true"><use href="#nacho-arch"/></svg>' +
  "<p>Select an app from the index, or create one.</p></div>";

/* ===================================================================== */
/* HTTP helper                                                            */
/* ===================================================================== */
async function api(method, path, body) {
  const headers = {};
  if (body !== undefined) headers["Content-Type"] = "application/json";
  if (state.apiKey) headers["Authorization"] = "Bearer " + state.apiKey;
  const resp = await fetch(BASE + path, {
    method,
    headers,
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  let payload = null;
  const text = await resp.text();
  if (text) { try { payload = JSON.parse(text); } catch (_) { payload = text; } }
  if (!resp.ok) {
    const err = new Error("Request failed");
    err.status = resp.status;
    err.detail = payload && payload.detail !== undefined ? payload.detail : payload;
    throw err;
  }
  return { data: payload, headers: resp.headers };
}

function errText(err) {
  if (err.status === 401 || err.status === 403) return "Unauthorized — check your API key.";
  const d = err.detail;
  if (d == null) return "Request failed (" + (err.status || "network") + ").";
  if (typeof d === "string") return d;
  if (d.error === "revision_conflict")
    return "Revision conflict: server is at " + d.actual + ", you sent " + d.expected + ".";
  return JSON.stringify(d);
}

/* ----- Format conversion (json / yaml / toml), handled server-side ----- */
async function convertFormat(data, from, to) {
  if (from === to && typeof data === "string") return data;
  const { data: res } = await api("POST", "/api/convert", { data: data, from: from, to: to });
  return res.data;
}
async function serialize(obj, fmt) {
  if (fmt === "json") return JSON.stringify(obj, null, 2);
  return convertFormat(obj, "json", fmt);
}
async function serializeSafe(obj, fmt, label) {
  try { return { text: await serialize(obj, fmt), fmt: fmt }; }
  catch (_) {
    toast("Cannot show " + label + " as " + fmt.toUpperCase() + " — showing JSON instead.");
    return { text: JSON.stringify(obj, null, 2), fmt: "json" };
  }
}

/* ===================================================================== */
/* Cookie (needed so the WebSocket handshake can authenticate)             */
/* ===================================================================== */
/* The server (auth.py) compares the raw cookie value against the API key and
   never URL-decodes it, so the value must be written unencoded here. `Secure`
   is added when served over HTTPS. */
function setAuthCookie(key) {
  const secure = location.protocol === "https:" ? "; Secure" : "";
  document.cookie = "NACHO_api_key=" + key + "; path=" + COOKIE_PATH + "; SameSite=Strict" + secure;
}
function clearAuthCookie() {
  const secure = location.protocol === "https:" ? "; Secure" : "";
  document.cookie = "NACHO_api_key=; path=" + COOKIE_PATH + "; Max-Age=0; SameSite=Strict" + secure;
}

/* ===================================================================== */
/* Toast                                                                  */
/* ===================================================================== */
let toastTimer = null;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ===================================================================== */
/* Notices — editorial rule-notices; success auto-dismisses after 4s      */
/* ===================================================================== */
function notice(kind, html) {
  const role = kind === "error" ? ' role="alert"' : "";
  return '<div class="notice ' + kind + '"' + role + ">" + html + "</div>";
}
const noticeTimers = {};
function slotNotice(id, html, autoDismiss) {
  const n = $(id);
  if (!n) return;
  clearTimeout(noticeTimers[id]);
  n.innerHTML = html || "";
  if (autoDismiss && html) {
    noticeTimers[id] = setTimeout(() => { if (n.isConnected) n.innerHTML = ""; }, 4000);
  }
}
function configNotice(html, autoDismiss) { slotNotice("config-notice", html, autoDismiss); }
function schemaNotice(html, autoDismiss) { slotNotice("schema-notice", html, autoDismiss); }

/* ===================================================================== */
/* Syntax highlighting — json / yaml / toml                                */
/* ===================================================================== */
function escHtml(s) {
  return s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

function highlightJSON(src) {
  return escHtml(src).replace(
    /("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false|null)\b|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g,
    (m, str, colon, kw, num) => {
      if (str !== undefined) {
        const cls = colon ? "tok-key" : "tok-str";
        return '<span class="' + cls + '">' + str + "</span>" + (colon || "");
      }
      if (kw !== undefined) return '<span class="tok-kw">' + kw + "</span>";
      return '<span class="tok-num">' + num + "</span>";
    }
  );
}

// Highlight a scalar fragment (already HTML-escaped): strings, keywords, numbers.
function highlightScalar(v) {
  return v.replace(
    /("(?:\\.|[^"\\])*"|'[^']*')|\b(true|false|null|yes|no)\b|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/gi,
    (m, str, kw, num) => {
      if (str !== undefined) return '<span class="tok-str">' + str + "</span>";
      if (kw !== undefined) return '<span class="tok-kw">' + kw + "</span>";
      return '<span class="tok-num">' + num + "</span>";
    }
  );
}

function highlightYAML(src) {
  return escHtml(src).split("\n").map((line) => {
    let m = line.match(/^(\s*)(#.*)$/);
    if (m) return m[1] + '<span class="tok-comment">' + m[2] + "</span>";
    m = line.match(/^(\s*(?:-\s+)?)([^:#\s][^:#]*?)(:)(\s.*|)$/);
    if (m) return m[1] + '<span class="tok-key">' + m[2] + "</span>" + m[3] + highlightScalar(m[4]);
    m = line.match(/^(\s*-\s+)(.*)$/);
    if (m) return m[1] + highlightScalar(m[2]);
    return highlightScalar(line);
  }).join("\n");
}

function highlightTOML(src) {
  return escHtml(src).split("\n").map((line) => {
    let m = line.match(/^(\s*)(#.*)$/);
    if (m) return m[1] + '<span class="tok-comment">' + m[2] + "</span>";
    m = line.match(/^(\s*)(\[\[?[^\]]*\]\]?)(\s*)$/);
    if (m) return m[1] + '<span class="tok-key">' + m[2] + "</span>" + m[3];
    m = line.match(/^(\s*)([A-Za-z0-9_."\-]+)(\s*=\s*)(.*)$/);
    if (m) return m[1] + '<span class="tok-key">' + m[2] + "</span>" + m[3] + highlightScalar(m[4]);
    return highlightScalar(line);
  }).join("\n");
}

function highlight(text, lang) {
  if (lang === "yaml") return highlightYAML(text);
  if (lang === "toml") return highlightTOML(text);
  return highlightJSON(text);
}

/* ===================================================================== */
/* Code editor — transparent textarea over a highlighted backdrop          */
/* ===================================================================== */
function mountCodeEditor(host, opts) {
  opts = opts || {};
  let lang = opts.language || "json";
  const wrap = document.createElement("div");
  wrap.className = "code-wrap" + (opts.variant ? " " + opts.variant : "");
  const pre = document.createElement("pre");
  pre.className = "code-hl";
  pre.setAttribute("aria-hidden", "true");
  const code = document.createElement("code");
  pre.appendChild(code);
  const ta = document.createElement("textarea");
  ta.className = "code-input";
  ta.spellcheck = false;
  ta.autocapitalize = "off";
  ta.setAttribute("autocomplete", "off");
  if (opts.ariaLabel) ta.setAttribute("aria-label", opts.ariaLabel);
  if (opts.readOnly) ta.readOnly = true;
  wrap.append(pre, ta);
  host.appendChild(wrap);

  const render = () => { code.innerHTML = highlight(ta.value, lang) + "\n"; };
  const sync = () => { pre.scrollTop = ta.scrollTop; pre.scrollLeft = ta.scrollLeft; };

  ta.addEventListener("input", () => {
    render(); sync();
    if (opts.onInput) opts.onInput();
  });
  ta.addEventListener("scroll", sync);
  ta.addEventListener("focus", () => wrap.classList.add("focus"));
  ta.addEventListener("blur", () => wrap.classList.remove("focus"));
  ta.addEventListener("keydown", (e) => {
    // Cmd/Ctrl+S saves — scoped to the editor textarea, never global.
    if ((e.metaKey || e.ctrlKey) && (e.key === "s" || e.key === "S")) {
      e.preventDefault();
      if (opts.onSave) opts.onSave();
      return;
    }
    if (e.key !== "Tab") return;
    e.preventDefault();
    ta.setRangeText("  ", ta.selectionStart, ta.selectionEnd, "end");
    ta.dispatchEvent(new Event("input"));
  });

  ta.value = opts.value || "";
  render();

  return {
    textarea: ta,
    get value() { return ta.value; },
    set value(v) { ta.value = v; render(); sync(); },
    setLanguage(l) { lang = l; render(); },
    focus() { ta.focus(); },
  };
}

/* ===================================================================== */
/* Format switcher — visually-hidden radios + styled labels                */
/* ===================================================================== */
function fmtSwitcher(prefix, sel) {
  let html = '<span class="fmt-group" role="radiogroup" aria-label="Editor format">';
  FORMATS.forEach((f, i) => {
    if (i) html += '<span class="sep">·</span>';
    html += '<input type="radio" class="fmt-radio" name="' + prefix + '" id="' +
      prefix + "-" + f + '" value="' + f + '"' + (f === sel ? " checked" : "") + ">" +
      '<label class="fmt-opt" for="' + prefix + "-" + f + '">' + f.toUpperCase() + "</label>";
  });
  return html + "</span>";
}
function bindFmtSwitcher(prefix, handler) {
  document.querySelectorAll('input[name="' + prefix + '"]').forEach((r) => {
    r.onchange = () => handler(r.value);
  });
}
function setFmtSwitcher(prefix, fmt) {
  const r = $(prefix + "-" + fmt);
  if (r) r.checked = true;
}

/* ===================================================================== */
/* Connect flow                                                           */
/* ===================================================================== */
async function boot() {
  let health = {};
  try {
    const r = await fetch(BASE + "/health");
    health = await r.json();
  } catch (_) { /* server may still be coming up */ }
  state.authRequired = health.auth_required !== false;
  state.readOnly = !!health.read_only;
  const ver = health.version ? "v" + health.version : "";
  $("server-ver").textContent = ver;
  $("signin-ver").textContent = ver;

  if (!state.authRequired) { state.apiKey = ""; await enterApp(); return; }
  if (state.apiKey && (await tryConnect())) return;
  showConnect();
}

function showConnect() {
  $("connect-view").classList.remove("hidden");
  $("app-view").classList.add("hidden");
  $("key-input").value = state.apiKey;
  $("key-input").focus();
}

async function tryConnect() {
  try {
    await api("GET", "/api/apps");
    await enterApp();
    return true;
  } catch (err) {
    if (err.status === 401 || err.status === 403) return false;
    $("connect-error").textContent = errText(err);
    return false;
  }
}

$("connect-btn").onclick = async () => {
  const btn = $("connect-btn");
  const key = $("key-input").value.trim();
  $("connect-error").textContent = "";
  if (!key) { $("connect-error").textContent = "API key is required."; return; }
  btn.disabled = true;
  try {
    state.apiKey = key;
    setAuthCookie(key);
    if (await tryConnect()) {
      localStorage.setItem("nacho_api_key", key);
    } else if (!$("connect-error").textContent) {
      $("connect-error").textContent = "Invalid API key.";
    }
  } finally {
    btn.disabled = false;
  }
};
$("key-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") $("connect-btn").click();
});

$("disconnect-btn").onclick = async () => {
  if (!(await confirmDiscard())) return;
  closeWs();
  clearInterval(state.appsPoll);
  state.apiKey = "";
  state.selected = null;
  clearDrafts();
  localStorage.removeItem("nacho_api_key");
  clearAuthCookie();
  showConnect();
};

async function enterApp() {
  if (state.apiKey) setAuthCookie(state.apiKey);
  $("connect-view").classList.add("hidden");
  $("app-view").classList.remove("hidden");
  $("ro-badge").classList.toggle("hidden", !state.readOnly);
  if (!state.selected) $("content").innerHTML = EMPTY_MAIN;
  try {
    await refreshApps();
  } catch (err) {
    $("app-list").innerHTML = notice("error", esc(errText(err)));
  }
  // Keep the index (revisions, other apps) reasonably fresh.
  clearInterval(state.appsPoll);
  state.appsPoll = setInterval(() => refreshApps().catch(() => {}), 30000);
}

/* ===================================================================== */
/* App index                                                              */
/* ===================================================================== */
async function refreshApps() {
  const { data } = await api("GET", "/api/apps");
  state.apps = data.data || {};
  if (state.selected && !state.apps[state.selected]) {
    // The selected app was deleted or renamed elsewhere — drop the stale pane.
    state.selected = null;
    clearDrafts();
    closeWs();
    $("content").innerHTML = EMPTY_MAIN;
  }
  renderAppList();
}

function renderAppList() {
  const list = $("app-list");
  const names = Object.keys(state.apps).sort();
  if (!names.length) {
    list.innerHTML = '<div class="index-empty">' +
      '<svg class="arch" width="24" height="24" aria-hidden="true"><use href="#nacho-arch"/></svg>' +
      "<p>No apps yet.</p>" +
      '<button class="link" id="first-app-btn">Create the first app</button></div>';
    $("first-app-btn").onclick = openNewAppModal;
    return;
  }
  list.innerHTML = "";
  for (const name of names) {
    const info = state.apps[name];
    const conn = info.connections || 0;
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "app-item" + (name === state.selected ? " active" : "");
    btn.title = conn === 1 ? "1 connected client" : conn + " connected clients";
    // The connection count is omitted at zero — absence is the quiet state.
    btn.innerHTML = '<span class="app-name">' + esc(name) + "</span>" +
      '<span class="app-meta">' + (conn ? esc(conn) + " · " : "") +
      "r" + esc(info.revision) + "</span>";
    btn.onclick = () => selectApp(name);
    list.appendChild(btn);
  }
}

/* ===================================================================== */
/* App detail                                                             */
/* ===================================================================== */
function clearDrafts() {
  state.drafts = { config: null, schema: null };
  configEd = null;
  schemaEd = null;
}

async function selectApp(name) {
  if (state.selected === name) return;
  if (!(await confirmDiscard())) return;
  clearDrafts();
  state.selected = name;
  renderAppList();
  await loadAppDetail(name);
  openWs(name);
}

async function loadAppDetail(name) {
  let configObj, schemaObj;
  try {
    const cfg = await api("GET", "/api/apps/" + encodeURIComponent(name) + "/config");
    configObj = cfg.data;
    state.revision = parseInt(cfg.headers.get("X-Nacho-Revision"), 10) || state.apps[name]?.revision || 1;
    const sch = await api("GET", "/api/apps/" + encodeURIComponent(name) + "/schema");
    schemaObj = sch.data.data;
  } catch (err) {
    $("content").innerHTML = notice("error", esc(errText(err)));
    return;
  }
  state.configObj = configObj;
  state.schema = schemaObj;
  // A full (re)load is always adopt-server-truth: drafts do not survive it.
  clearDrafts();

  const cfg = await serializeSafe(configObj, state.configFormat, "configuration");
  state.configFormat = cfg.fmt;
  state.pristine = cfg.text;

  if (schemaObj) {
    const sch = await serializeSafe(schemaObj, state.schemaFormat, "schema");
    state.schemaFormat = sch.fmt;
    state.schemaPristine = sch.text;
  } else {
    state.schemaPristine = "";
  }
  renderDetail();
}

function renderDetail() {
  const name = state.selected;
  const info = state.apps[name] || {};
  const wsOn = !!(state.ws && state.ws.readyState === 1);
  const c = $("content");
  c.innerHTML = `
    <header class="detail-head">
      <div class="dh-row">
        <h1>${esc(name)}</h1>
        <span class="spacer"></span>
        <span class="dh-actions">
          <button class="link" id="meta-btn">Edit</button>
          <span class="sep">·</span>
          <button class="link danger" id="delete-btn">Delete</button>
        </span>
      </div>
      <p class="desc${info.description ? "" : " none"}">${esc(info.description || "No description")}</p>
      <p class="status-line">
        <span class="live-seg"><span class="live-dot ${wsOn ? "on" : "off"}" id="live-dot"></span><span id="live-label">${wsOn ? "live" : "offline"}</span></span>
        <span class="sep">·</span>
        <span>r<span id="rev-label">${esc(state.revision)}</span></span>
        <span class="sep">·</span>
        <span>${esc(info.connections || 0)} watching</span>
        <span class="sep">·</span>
        <span id="schema-flag" class="${state.schema ? "" : "faint"}">${state.schema ? "schema ✓" : "no schema"}</span>
      </p>
    </header>
    <div class="tabs" role="tablist" aria-label="App sections">
      <button class="tab" role="tab" aria-selected="false" data-tab="config">Configuration<span class="tab-dot" role="img" aria-label="unsaved changes" hidden></span></button>
      <button class="tab" role="tab" aria-selected="false" data-tab="schema">Schema<span class="tab-dot" role="img" aria-label="unsaved changes" hidden></span></button>
      <button class="tab" role="tab" aria-selected="false" data-tab="history">History</button>
    </div>
    <div id="tab-body" role="tabpanel"></div>
  `;
  $("live-dot").addEventListener("animationend", () => $("live-dot").classList.remove("pulse"));
  $("meta-btn").onclick = openMetaModal;
  $("delete-btn").onclick = deleteApp;
  const tabs = Array.from(c.querySelectorAll(".tab"));
  tabs.forEach((t, i) => {
    t.onclick = () => switchTab(t.dataset.tab);
    t.onkeydown = (e) => {
      if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
      e.preventDefault();
      tabs[(i + (e.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length].focus();
    };
  });
  switchTab(state.activeTab, true);
}

/* Stash a dirty editor's buffer before its tab is torn down. */
function stashDrafts() {
  if (configEd) state.drafts.config = isConfigDirty() ? configEd.value : null;
  if (schemaEd) state.drafts.schema = isSchemaDirty() ? schemaEd.value : null;
}

function switchTab(tab, force) {
  // Re-clicking the already-active tab must not re-render from pristine —
  // that would silently discard unsaved edits. `force` is used after a full
  // detail re-render, when the tab body is empty and must be rebuilt.
  if (!force && tab === state.activeTab) return;
  // Tab switches never prompt: dirty buffers are preserved as drafts and
  // restored on re-entry. Discard only happens on app switch / Discard /
  // Load-server-version / sign-out.
  stashDrafts();
  state.activeTab = tab;
  configEd = null;
  schemaEd = null;
  document.querySelectorAll(".tab").forEach((t) => {
    const on = t.dataset.tab === tab;
    t.classList.toggle("active", on);
    t.setAttribute("aria-selected", on ? "true" : "false");
  });
  if (tab === "config") renderConfigTab();
  else if (tab === "history") renderHistoryTab();
  else renderSchemaTab();
  updateTabDots();
}

/* ----- Configuration tab ----- */
function renderConfigTab(text) {
  $("tab-body").innerHTML = `
    <div id="config-notice"></div>
    <div class="toolbar">
      ${fmtSwitcher("cfg-fmt", state.configFormat)}
      <button class="link" id="format-btn">Tidy</button>
      <button class="link" id="validate-btn">Validate</button>
      <span class="spacer"></span>
      <span class="ed-status mono-data">
        <span class="status-text" id="editor-status"></span>
        <span class="sep" id="editor-aux-sep">·</span>
        <button class="link faint" id="refresh-link">refresh</button>
        <button class="link" id="discard-link" hidden>Discard</button>
      </span>
      ${state.readOnly ? "" : '<button class="btn" id="save-btn">Save</button>'}
    </div>
    <div id="config-host"></div>
  `;
  configEd = mountCodeEditor($("config-host"), {
    value: text !== undefined ? text :
      (state.drafts.config != null ? state.drafts.config : state.pristine),
    language: state.configFormat,
    readOnly: state.readOnly,
    variant: "cfg",
    ariaLabel: "Configuration editor",
    onInput: updateDirty,
    onSave: () => { if (!state.readOnly && isConfigDirty()) saveConfig(); },
  });
  bindFmtSwitcher("cfg-fmt", changeConfigFormat);
  $("format-btn").onclick = formatConfig;
  $("validate-btn").onclick = validateConfig;
  $("refresh-link").onclick = () => loadAppDetail(state.selected);
  $("discard-link").onclick = async () => { if (await confirmDiscard()) loadAppDetail(state.selected); };
  const save = $("save-btn");
  if (save) save.onclick = saveConfig;
  updateDirty();
}

async function changeConfigFormat(fmt) {
  if (fmt === state.configFormat) return;
  let editorText = "", pristineText = "";
  try {
    if (configEd.value.trim())
      editorText = await convertFormat(configEd.value, state.configFormat, fmt);
    pristineText = await serialize(state.configObj, fmt);
  } catch (e) {
    configNotice(notice("error", "<strong>Cannot convert to " + fmt.toUpperCase() +
      ".</strong> " + esc(errText(e))));
    setFmtSwitcher("cfg-fmt", state.configFormat);
    return;
  }
  state.configFormat = fmt;
  localStorage.setItem("nacho_config_format", fmt);
  state.pristine = pristineText;
  renderConfigTab(editorText);
}

/* ----- Schema tab ----- */
function renderSchemaTab(text) {
  $("tab-body").innerHTML = `
    <div id="schema-notice"></div>
    <div class="toolbar">
      ${fmtSwitcher("sch-fmt", state.schemaFormat)}
      <button class="link" id="schema-format-btn">Tidy</button>
      <button class="link danger" id="schema-clear-btn"${state.readOnly ? " disabled" : ""}>Clear</button>
      <span class="spacer"></span>
      <span class="ed-status mono-data">
        <span class="status-text" id="schema-status"></span>
        <span class="sep" id="schema-aux-sep">·</span>
        <button class="link faint" id="schema-refresh-link">refresh</button>
        <button class="link" id="schema-discard-link" hidden>Discard</button>
      </span>
      ${state.readOnly ? "" : '<button class="btn" id="schema-save-btn">Save schema</button>'}
    </div>
    <div id="schema-host"></div>
    <p class="hint">A JSON Schema validates every config write. An empty editor
      clears the schema.</p>
  `;
  schemaEd = mountCodeEditor($("schema-host"), {
    value: text !== undefined ? text :
      (state.drafts.schema != null ? state.drafts.schema : state.schemaPristine),
    language: state.schemaFormat,
    readOnly: state.readOnly,
    variant: "sch",
    ariaLabel: "Schema editor",
    onInput: updateSchemaDirty,
    onSave: () => { if (!state.readOnly && isSchemaDirty()) saveSchema(); },
  });
  bindFmtSwitcher("sch-fmt", changeSchemaFormat);
  $("schema-format-btn").onclick = formatSchema;
  $("schema-clear-btn").onclick = () => { schemaEd.value = ""; updateSchemaDirty(); };
  $("schema-refresh-link").onclick = () => loadAppDetail(state.selected);
  $("schema-discard-link").onclick = async () => { if (await confirmDiscard()) loadAppDetail(state.selected); };
  const save = $("schema-save-btn");
  if (save) save.onclick = saveSchema;
  updateSchemaDirty();
}

async function changeSchemaFormat(fmt) {
  if (fmt === state.schemaFormat) return;
  let editorText = "", pristineText = "";
  try {
    if (schemaEd.value.trim())
      editorText = await convertFormat(schemaEd.value, state.schemaFormat, fmt);
    if (state.schema) pristineText = await serialize(state.schema, fmt);
  } catch (e) {
    schemaNotice(notice("error", "<strong>Cannot convert to " + fmt.toUpperCase() +
      ".</strong> " + esc(errText(e))));
    setFmtSwitcher("sch-fmt", state.schemaFormat);
    return;
  }
  state.schemaFormat = fmt;
  localStorage.setItem("nacho_schema_format", fmt);
  state.schemaPristine = pristineText;
  renderSchemaTab(editorText);
}

/* ----- History tab ----- */
async function renderHistoryTab() {
  state.openSnapshot = null;
  $("tab-body").innerHTML = '<div id="history-notice"></div>' +
    '<div id="history-body"><p class="hint">Loading history…</p></div>';
  let entries;
  try {
    const res = await api("GET",
      "/api/apps/" + encodeURIComponent(state.selected) + "/history");
    entries = res.data.data || [];
  } catch (err) {
    $("history-body").innerHTML = notice("error", esc(errText(err)));
    return;
  }
  if (!entries.length) {
    $("history-body").innerHTML = '<p class="hist-empty">No history recorded yet.</p>';
    return;
  }
  const rows = entries.map((e) => {
    const current = e.revision === state.revision;
    return "<tr>" +
      '<td class="mono-data">r' + esc(e.revision) +
      (current ? '<span class="cur-dot" role="img" aria-label="current"></span><span class="cur-txt"> (current)</span>' : "") +
      "</td>" +
      '<td class="mono-data">' + esc(e.updated_at || "") + "</td>" +
      '<td class="mono-data">' + esc(e.config_count) + "</td>" +
      '<td class="schema-col">' + (e.schema ? "✓" : '<span class="faint">—</span>') + "</td>" +
      '<td class="row-actions"><button class="link" data-view="' + e.revision + '">View</button>' +
      '<button class="link" data-restore="' + e.revision + '"' +
      (current || state.readOnly ? " disabled" : "") + ">Restore</button></td>" +
      "</tr>";
  }).join("");
  $("history-body").innerHTML =
    '<div class="history-wrap"><table class="history-table"><thead><tr>' +
    "<th>Revision</th><th>Updated</th><th>Keys</th><th>Schema</th><th></th>" +
    "</tr></thead><tbody>" + rows + "</tbody></table></div>";
  $("history-body").querySelectorAll("[data-view]").forEach((b) => {
    b.onclick = () => toggleHistorySnapshot(parseInt(b.dataset.view, 10), b.closest("tr"));
  });
  $("history-body").querySelectorAll("[data-restore]").forEach((b) => {
    b.onclick = () => restoreHistorySnapshot(parseInt(b.dataset.restore, 10));
  });
}

/* The snapshot expands inline directly under its row. */
async function toggleHistorySnapshot(revision, tr) {
  const existing = document.querySelector(".snap-row");
  const wasOpen = state.openSnapshot === revision;
  if (existing) existing.remove();
  state.openSnapshot = null;
  if (wasOpen) return;
  const row = document.createElement("tr");
  row.className = "snap-row";
  const td = document.createElement("td");
  td.colSpan = 5;
  td.innerHTML = '<p class="snap-head">r' + esc(revision) + ' — loading…</p>';
  row.appendChild(td);
  tr.after(row);
  state.openSnapshot = revision;
  try {
    const res = await api("GET", "/api/apps/" +
      encodeURIComponent(state.selected) + "/history/" + revision);
    const snap = res.data.data;
    if (state.openSnapshot !== revision || !row.isConnected) return;
    td.innerHTML = '<p class="snap-head">r' + esc(revision) + " — config + schema</p>" +
      '<pre class="snap-pre"><code>' +
      highlightJSON(JSON.stringify({ config: snap.config, schema: snap.schema }, null, 2)) +
      "</code></pre>";
  } catch (err) {
    if (row.isConnected) td.innerHTML = notice("error", esc(errText(err)));
  }
}

async function restoreHistorySnapshot(revision) {
  if (anyDirty() && !(await confirmDiscard())) return;
  if (!(await confirmDialog({
    title: "Restore revision " + revision + "?",
    body: "This creates a new revision with r" + revision + "'s config and " +
      "schema. History is never rewritten — this rollback can itself be rolled back.",
    confirmLabel: "Restore",
  }))) return;
  try {
    await api("POST",
      "/api/apps/" + encodeURIComponent(state.selected) + "/rollback",
      { revision: revision, expected_revision: state.revision });
    await refreshApps();
    await loadAppDetail(state.selected);
    toast("Restored r" + revision + " → now r" + state.revision + ".");
  } catch (err) {
    slotNotice("history-notice", notice("error", esc(errText(err))));
  }
}

/* ----- Dirty tracking ----- */
function isConfigDirty() { return !!(configEd && configEd.value !== state.pristine); }
function isSchemaDirty() { return !!(schemaEd && schemaEd.value !== state.schemaPristine); }
function configDraftDirty() {
  return configEd ? isConfigDirty()
    : state.drafts.config != null && state.drafts.config !== state.pristine;
}
function schemaDraftDirty() {
  return schemaEd ? isSchemaDirty()
    : state.drafts.schema != null && state.drafts.schema !== state.schemaPristine;
}
function anyDirty() { return configDraftDirty() || schemaDraftDirty(); }

function setStatus(id, dirty) {
  const s = $(id);
  if (!s) return;
  if (state.readOnly) { s.textContent = "read-only"; return; }
  // The literal strings below are load-bearing (asserted by the UI tests);
  // the bullet is styled amber via .sdot.
  if (dirty) s.innerHTML = '<span class="sdot">●</span> Unsaved changes';
  else s.textContent = "Saved";
  s.classList.toggle("dirty", dirty);
}

/* A tab whose live buffer or stashed draft is dirty shows an amber dot. */
function updateTabDots() {
  const dots = {
    config: configDraftDirty(),
    schema: schemaDraftDirty(),
  };
  for (const tab of ["config", "schema"]) {
    const el = document.querySelector('.tab[data-tab="' + tab + '"] .tab-dot');
    if (el) el.hidden = !dots[tab];
  }
}

function updateDirty() {
  const dirty = isConfigDirty();
  setStatus("editor-status", dirty);
  const save = $("save-btn");
  if (save) { save.disabled = !dirty; save.classList.toggle("armed", dirty); }
  const r = $("refresh-link"), d = $("discard-link"), sep = $("editor-aux-sep");
  if (r) r.hidden = dirty || state.readOnly;
  if (d) d.hidden = !dirty || state.readOnly;
  if (sep) sep.hidden = state.readOnly;
  updateTabDots();
}
function updateSchemaDirty() {
  const dirty = isSchemaDirty();
  setStatus("schema-status", dirty);
  const save = $("schema-save-btn");
  if (save) { save.disabled = !dirty; save.classList.toggle("armed", dirty); }
  const r = $("schema-refresh-link"), d = $("schema-discard-link"), sep = $("schema-aux-sep");
  if (r) r.hidden = dirty || state.readOnly;
  if (d) d.hidden = !dirty || state.readOnly;
  if (sep) sep.hidden = state.readOnly;
  updateTabDots();
}

async function confirmDiscard() {
  if (!anyDirty()) return true;
  const parts = [];
  if (configDraftDirty()) parts.push("configuration");
  if (schemaDraftDirty()) parts.push("schema");
  return confirmDialog({
    title: "Discard unsaved changes?",
    body: 'Unsaved ' + parts.join(" and ") + ' edits to "' + state.selected +
      '" will be lost.',
    confirmLabel: "Discard",
    cancelLabel: "Keep editing",
    danger: true,
  });
}

/* ----- Configuration actions ----- */
async function formatConfig() {
  try {
    if (!configEd.value.trim()) return;
    configEd.value = await convertFormat(configEd.value, state.configFormat, state.configFormat);
    updateDirty();
    configNotice("");
  } catch (e) {
    configNotice(notice("error", "<strong>Invalid.</strong> " + esc(errText(e))));
  }
}

async function validateConfig() {
  try {
    const { data } = await api("POST",
      "/api/apps/" + encodeURIComponent(state.selected) + "/validate",
      { data: configEd.value, format: state.configFormat });
    if (data.valid) {
      configNotice(notice("ok", "✓ Valid against the schema."), true);
    } else {
      configNotice(notice("error", "<strong>Invalid.</strong><ul>" +
        data.errors.map((e) => "<li>" + esc(e) + "</li>").join("") + "</ul>"));
    }
  } catch (err) {
    configNotice(notice("error", "<strong>Invalid.</strong> " + esc(errText(err))));
  }
}

function conflictNotice(err, reloadId) {
  const d = err.detail || {};
  const lead = d.actual != null
    ? "<strong>Revision conflict</strong> — the server is at r" + esc(d.actual) +
      ", you saved against r" + esc(d.expected) + "."
    : "<strong>Revision conflict</strong> — " + esc(errText(err));
  return notice("warn", lead +
    ' <button class="link" id="' + reloadId + '">Load latest</button>');
}

async function saveConfig() {
  const save = $("save-btn");
  if (save) save.disabled = true;
  try {
    const { data } = await api("PUT",
      "/api/apps/" + encodeURIComponent(state.selected) + "/config",
      { data: configEd.value, format: state.configFormat, revision: state.revision });
    applyRevision(data.revision);
    state.configObj = data.data;
    state.pristine = await serialize(state.configObj, state.configFormat);
    configEd.value = state.pristine;
    configNotice("");
    toast("Saved — r" + state.revision + ".");
    await refreshApps();
  } catch (err) {
    if (err.status === 409) {
      configNotice(conflictNotice(err, "conflict-reload"));
      $("conflict-reload").onclick = () => loadAppDetail(state.selected);
    } else {
      configNotice(notice("error", "<strong>Invalid.</strong> " + esc(errText(err))));
    }
  } finally {
    updateDirty();
  }
}

/* ----- Schema actions ----- */
async function formatSchema() {
  try {
    if (!schemaEd.value.trim()) { schemaNotice(""); return; }
    schemaEd.value = await convertFormat(schemaEd.value, state.schemaFormat, state.schemaFormat);
    updateSchemaDirty();
    schemaNotice("");
  } catch (e) {
    schemaNotice(notice("error", "<strong>Invalid.</strong> " + esc(errText(e))));
  }
}

async function saveSchema() {
  const raw = schemaEd.value.trim();
  const body = { revision: state.revision };
  if (raw) { body.schema = schemaEd.value; body.schema_format = state.schemaFormat; }
  else { body.schema = null; }
  const save = $("schema-save-btn");
  if (save) save.disabled = true;
  try {
    const { data } = await api("PUT",
      "/api/apps/" + encodeURIComponent(state.selected) + "/schema", body);
    applyRevision(data.revision);
    state.schema = data.schema;
    state.schemaPristine = data.schema ? await serialize(data.schema, state.schemaFormat) : "";
    schemaEd.value = state.schemaPristine;
    setSchemaFlag();
    schemaNotice(notice("ok",
      state.schema ? "✓ Schema saved." : "✓ Schema cleared."), true);
    toast("Schema saved — r" + state.revision + ".");
    await refreshApps();
  } catch (err) {
    if (err.status === 409) {
      schemaNotice(conflictNotice(err, "schema-conflict-reload"));
      $("schema-conflict-reload").onclick = () => loadAppDetail(state.selected);
    } else {
      // A 400 here usually means the current config violates the new schema.
      schemaNotice(notice("error", "<strong>Schema rejected.</strong> " + esc(errText(err))));
    }
  } finally {
    updateSchemaDirty();
  }
}

function setSchemaFlag() {
  const flag = $("schema-flag");
  if (!flag) return;
  flag.textContent = state.schema ? "schema ✓" : "no schema";
  flag.classList.toggle("faint", !state.schema);
}

function applyRevision(rev) {
  if (rev == null) return;
  state.revision = rev;
  const label = $("rev-label");
  if (label) label.textContent = rev;
}

async function deleteApp() {
  const name = state.selected;
  if (!(await confirmDialog({
    title: 'Delete "' + name + '"?',
    body: "This removes the app, its history, and disconnects its watchers. " +
      "It cannot be undone.",
    confirmLabel: "Delete",
    danger: true,
  }))) return;
  try {
    await api("DELETE", "/api/apps/" + encodeURIComponent(name));
    closeWs();
    state.selected = null;
    clearDrafts();
    $("content").innerHTML = EMPTY_MAIN;
    await refreshApps();
    toast('"' + name + '" deleted.');
  } catch (err) {
    toast("Couldn't delete — " + errText(err));
  }
}

/* ===================================================================== */
/* WebSocket — live updates                                                */
/* ===================================================================== */
function closeWs() {
  clearTimeout(state.wsRetry);
  if (state.ws) {
    state.ws.onclose = null;
    try { state.ws.close(); } catch (_) {}
    state.ws = null;
  }
}

function openWs(name, attempt) {
  closeWs();
  attempt = attempt || 0;
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(
    proto + "://" + location.host + BASE + "/ws/" + encodeURIComponent(name)
  );
  state.ws = ws;
  ws.onopen = () => { setLive(true); attempt = 0; };
  ws.onclose = (ev) => {
    setLive(false);
    if (state.selected !== name) return;
    if (ev.code === 4004) {
      // The app was deleted server-side: reconnecting is pointless. Refresh
      // the list, which also clears the stale editor pane for a gone app.
      refreshApps().catch(() => {});
      return;
    }
    if (ev.code === 1008) {
      // Auth rejected: retrying with the same credentials cannot succeed.
      clearInterval(state.appsPoll);
      showConnect();
      $("connect-error").textContent = "Session or API key invalid — sign in again.";
      return;
    }
    // Reconnect with exponential backoff, capped at 30s. Never give up: a
    // server restart minutes later should not leave the UI silently stale.
    const delay = Math.min(30000, 2000 * Math.pow(2, attempt));
    state.wsRetry = setTimeout(() => openWs(name, attempt + 1), delay);
  };
  ws.onmessage = (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch (_) { return; }
    if (msg.app !== state.selected) return;
    if (msg.type === "initial_config" || msg.type === "update") onRemoteUpdate(msg);
  };
}

function setLive(on) {
  const dot = $("live-dot"), label = $("live-label");
  if (label) label.textContent = on ? "live" : "offline";
  if (dot) {
    const was = dot.classList.contains("on");
    dot.classList.toggle("on", on);
    dot.classList.toggle("off", !on);
    if (on && !was) {
      // One-shot connect pulse (2 iterations, never infinite).
      dot.classList.remove("pulse");
      void dot.offsetWidth;
      dot.classList.add("pulse");
    }
    if (!on) dot.classList.remove("pulse");
  }
}

async function onRemoteUpdate(msg) {
  // Apply monotonically: ignore out-of-order or duplicate broadcasts whose
  // revision is not newer than what we already have.
  if (msg.revision != null && state.revision != null && msg.revision <= state.revision) return;
  refreshApps().catch(() => {});
  if (anyDirty()) {
    // Do NOT adopt the new revision or reset pristine while there are unsaved
    // edits: the eventual Save must carry the OLD revision so the server can
    // 409 instead of silently overwriting the other writer's change. The
    // conflict-on-save flow then guides the user.
    const warn = notice("warn",
      "This app changed on the server (now r" + esc(msg.revision) + "). " +
      "Your unsaved edits are untouched; saving will report a conflict." +
      ' <button class="link" id="accept-remote">Load server version</button>');
    const acceptRemote = async () => { if (await confirmDiscard()) loadAppDetail(state.selected); };
    if (state.activeTab === "config" && configEd) {
      configNotice(warn);
      $("accept-remote").onclick = acceptRemote;
    } else if (state.activeTab === "schema" && schemaEd) {
      schemaNotice(warn);
      $("accept-remote").onclick = acceptRemote;
    }
    return;
  }
  applyRevision(msg.revision);
  if (msg.data !== undefined) {
    state.configObj = msg.data;
    if (state.activeTab === "config" && configEd) {
      let incoming;
      try { incoming = await serialize(msg.data, state.configFormat); }
      catch (_) { incoming = JSON.stringify(msg.data, null, 2); }
      state.pristine = incoming;
      configEd.value = incoming;
      updateDirty();
    } else {
      // Keep pristine in sync so a later return to the config tab is clean.
      try { state.pristine = await serialize(msg.data, state.configFormat); }
      catch (_) { state.pristine = JSON.stringify(msg.data, null, 2); }
    }
  }
  if (state.activeTab === "history") renderHistoryTab();
  // The schema is not carried in WS payloads — refresh it when it may be stale.
  if (state.activeTab === "schema" && schemaEd && !isSchemaDirty()) {
    try {
      const sch = await api("GET",
        "/api/apps/" + encodeURIComponent(state.selected) + "/schema");
      state.schema = sch.data.data;
      state.schemaPristine = state.schema
        ? await serialize(state.schema, state.schemaFormat) : "";
      schemaEd.value = state.schemaPristine;
      updateSchemaDirty();
      setSchemaFlag();
    } catch (_) { /* leave the current view as-is */ }
  }
}

/* ===================================================================== */
/* Modals                                                                  */
/* ===================================================================== */
function openModal(html) {
  const ov = $("modal-overlay");
  ov.innerHTML = '<div class="modal">' + html + "</div>";
  ov.classList.remove("hidden");
  ov.onclick = (e) => { if (e.target === ov) closeModal(); };
  // Pull focus off whatever was behind the overlay (e.g. a code editor) so
  // keystrokes land in the modal, not the editor underneath it.
  if (document.activeElement && document.activeElement.blur) {
    document.activeElement.blur();
  }
  const first = ov.querySelector("input, textarea, select, button");
  if (first) first.focus();
  // Keep Tab focus inside the modal while it is open.
  ov.onkeydown = (e) => {
    if (e.key !== "Tab") return;
    const f = ov.querySelectorAll("input, textarea, select, button");
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault(); last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault(); first.focus();
    }
  };
}
function closeModal() {
  $("modal-overlay").classList.add("hidden");
  $("modal-overlay").innerHTML = "";
}

/* Styled promise-based confirm — replaces every native confirm(). Cancel is
   a text link, confirm an ink-stamp button (danger fill when destructive). */
function confirmDialog(opts) {
  return new Promise((resolve) => {
    const invoker = document.activeElement;
    const ov = $("modal-overlay");
    ov.innerHTML =
      '<div class="modal" id="confirm-dialog" role="dialog" aria-modal="true"' +
      ' aria-labelledby="confirm-title">' +
      '<h3 id="confirm-title">' + esc(opts.title) + "</h3>" +
      '<p class="confirm-body">' + esc(opts.body || "") + "</p>" +
      '<div class="modal-actions">' +
      '<button class="link" id="confirm-cancel">' + esc(opts.cancelLabel || "Cancel") + "</button>" +
      '<button class="btn' + (opts.danger ? " danger" : "") + '" id="confirm-accept">' +
      esc(opts.confirmLabel || "OK") + "</button>" +
      "</div></div>";
    ov.classList.remove("hidden");
    let settled = false;
    const done = (val) => {
      if (settled) return;
      settled = true;
      closeModal();
      ov.onkeydown = null;
      ov.onclick = null;
      // Restore focus to the invoking element (if it survived the dialog).
      if (invoker && invoker.isConnected && invoker.focus) invoker.focus();
      resolve(val);
    };
    ov.onclick = (e) => { if (e.target === ov) done(false); };
    $("confirm-cancel").onclick = () => done(false);
    $("confirm-accept").onclick = () => done(true);
    // Escape cancels; Tab is trapped between the two actions. Enter on the
    // focused button activates it natively.
    ov.onkeydown = (e) => {
      if (e.key === "Escape") { e.preventDefault(); done(false); return; }
      if (e.key !== "Tab") return;
      e.preventDefault();
      const cancel = $("confirm-cancel"), accept = $("confirm-accept");
      (document.activeElement === accept ? cancel : accept).focus();
    };
    if (invoker && invoker.blur) invoker.blur();
    $("confirm-accept").focus();
  });
}

// Convert a plain modal textarea between formats, tracking the current format
// in a data attribute so the next switch knows the source format. Conversion
// failure re-checks the previous radio (revert-on-fail).
async function changeModalFormat(taId, prefix, to) {
  const ta = $(taId);
  const from = ta.dataset.fmt || "json";
  if (from === to) return;
  if (ta.value.trim()) {
    try { ta.value = await convertFormat(ta.value, from, to); }
    catch (e) {
      $("m-error").textContent = "Cannot convert to " + to.toUpperCase() + ": " + errText(e);
      setFmtSwitcher(prefix, from);
      return;
    }
  }
  ta.dataset.fmt = to;
  $("m-error").textContent = "";
}

}

async function createApp() {
  const name = $("m-name").value.trim();
  const desc = $("m-desc").value.trim();
  if (!name) { $("m-error").textContent = "Name is required."; return; }
  const body = {
    name,
    data: $("m-config").value.trim() || "{}",
    format: $("m-config").dataset.fmt || "json",
  };
  if (desc) body.description = desc;
  const schemaRaw = $("m-schema").value.trim();
  if (schemaRaw) {
    body.schema = schemaRaw;
    body.schema_format = $("m-schema").dataset.fmt || "json";
  }
  try {
    await api("POST", "/api/apps", body);
    closeModal();
    await refreshApps();
    await selectApp(name);
    toast('"' + name + '" created.');
  } catch (e) {
    $("m-error").textContent = errText(e);
  }
}

function openMetaModal() {
  const info = state.apps[state.selected] || {};
  openModal(`
    <h3>Edit app</h3>
    <div class="field">
      <label class="lbl" for="m-name">Name</label>
      <input class="u-input" id="m-name" value="${esc(state.selected)}" />
    </div>
    <div class="field">
      <label class="lbl" for="m-desc">Description</label>
      <input class="u-input" id="m-desc" value="${esc(info.description || "")}" />
    </div>
    <div class="modal-error" id="m-error"></div>
    <div class="modal-actions">
      <button class="link" id="m-cancel">Cancel</button>
      <button class="btn" id="m-save">Save</button>
    </div>
  `);
  $("m-cancel").onclick = closeModal;
  $("m-save").onclick = saveMeta;
}

async function saveMeta() {
  const name = $("m-name").value.trim();
  const desc = $("m-desc").value.trim();
  if (!name) { $("m-error").textContent = "Name is required."; return; }
  try {
    const { data } = await api("PATCH",
      "/api/apps/" + encodeURIComponent(state.selected) + "/metadata",
      { name, description: desc, revision: state.revision });
    closeModal();
    const renamed = data.app.name !== state.selected;
    state.selected = data.app.name;
    state.revision = data.app.revision;
    await refreshApps();
    if (renamed) { closeWs(); openWs(state.selected); }
    renderAppList();
    await loadAppDetail(state.selected);
    toast("App updated.");
  } catch (e) {
    $("m-error").textContent = errText(e);
  }
}

$("new-app-btn").onclick = openNewAppModal;
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape" || $("modal-overlay").classList.contains("hidden")) return;
  // A confirm dialog must resolve its promise — cancel it rather than
  // tearing the overlay down around it.
  const cancel = $("confirm-cancel");
  if (cancel) cancel.click();
  else closeModal();
});
window.addEventListener("beforeunload", (e) => {
  if (anyDirty()) { e.preventDefault(); e.returnValue = ""; }
});

/* ===================================================================== */
/* Go                                                                      */
/* ===================================================================== */
boot();
</script>
</body>
</html>
