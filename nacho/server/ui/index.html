/* ===================================================================== */
/* Diff — the same comparison `nacho history diff` performs, client-side.  */
/* Snapshots already carry the whole config, so no new endpoint is needed. */
/* ===================================================================== */

/* Canonical line form, matching the CLI's as_lines(): indent 2, keys sorted,
   so UI and CLI describe a revision identically. */
function stableLines(obj) {
  const walk = (v) => {
    if (Array.isArray(v)) return v.map(walk);
    if (v && typeof v === "object") {
      const out = {};
      for (const k of Object.keys(v).sort()) out[k] = walk(v[k]);
      return out;
    }
    return v;
  };
  return JSON.stringify(walk(obj == null ? {} : obj), null, 2).split("\n");
}

/* LCS diff. Configs are small; the guard keeps a pathological pair from
   locking the tab up, and callers fall back to the plain snapshot. */
function diffLines(a, b) {
  const n = a.length, m = b.length;
  if (n * m > 1500000) return null;
  const dp = [];
  for (let i = 0; i <= n; i++) dp.push(new Uint32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) {
      dp[i][j] = a[i] === b[j]
        ? dp[i + 1][j + 1] + 1
        : Math.max(dp[i + 1][j], dp[i][j + 1]);
    }
  }
  const rows = [];
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (a[i] === b[j]) { rows.push({ t: " ", s: a[i] }); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { rows.push({ t: "-", s: a[i] }); i++; }
    else { rows.push({ t: "+", s: b[j] }); j++; }
  }
  while (i < n) { rows.push({ t: "-", s: a[i] }); i++; }
  while (j < m) { rows.push({ t: "+", s: b[j] }); j++; }
  return rows;
}

/* Collapse unchanged runs to CTX lines either side, like a unified diff. */
function collapse(rows, ctx) {
  ctx = ctx == null ? 3 : ctx;
  const keep = new Array(rows.length).fill(false);
  rows.forEach((r, i) => {
    if (r.t === " ") return;
    for (let k = Math.max(0, i - ctx); k <= Math.min(rows.length - 1, i + ctx); k++) {
      keep[k] = true;
    }
  });
  const out = [];
  let skipped = 0;
  rows.forEach((r, i) => {
    if (keep[i]) {
      if (skipped) { out.push({ t: "@", n: skipped }); skipped = 0; }
      out.push(r);
    } else skipped++;
  });
  if (skipped) out.push({ t: "@", n: skipped });
  return out;
}

function diffStat(rows) {
  let add = 0, del = 0;
  for (const r of rows) { if (r.t === "+") add++; else if (r.t === "-") del++; }
  return { add: add, del: del };
}

/* The JSON key a changed line belongs to — the "what changed" in one phrase.
   A changed line inside an array or a nested object carries no key of its own,
   so fall back to the nearest enclosing key at a shallower indent. */
function indentOf(s) { return s.match(/^\s*/)[0].length; }

function changedPaths(rows) {
  const seen = [];
  const add = (k) => { if (k && seen.indexOf(k) === -1) seen.push(k); };
  rows.forEach((r, i) => {
    if (r.t !== "+" && r.t !== "-") return;
    const own = r.s.match(/^\s*"([^"]+)"\s*:/);
    if (own) { add(own[1]); return; }
    const depth = indentOf(r.s);
    for (let k = i - 1; k >= 0; k--) {
      const line = rows[k].s;
      if (indentOf(line) >= depth) continue;
      const m = line.match(/^\s*"([^"]+)"\s*:/);
      if (m) { add(m[1]); return; }
    }
  });
  return seen;
}

function renderDiff(rows) {
  return '<pre class="diff-pre"><code>' + rows.map((r) => {
    if (r.t === "@") {
      return '<span class="dl gap" data-m=" ">' +
        esc(r.n + (r.n === 1 ? " unchanged line" : " unchanged lines")) + "</span>";
    }
    const cls = r.t === "+" ? "dl add" : r.t === "-" ? "dl del" : "dl";
    return '<span class="' + cls + '" data-m="' + r.t + '">' +
      highlightJSON(r.s) + "</span>";
  }).join("") + "</code></pre>";
}

/* Snapshot cache — history rows fetch their predecessor to diff against, and
   the same revision is asked for repeatedly as rows expand. */
const snapCache = new Map();
function snapKey(app, rev) { return app + "@" + rev; }
async function getSnapshot(app, rev) {
  const k = snapKey(app, rev);
  if (snapCache.has(k)) return snapCache.get(k);
  const res = await api("GET",
    "/api/apps/" + encodeURIComponent(app) + "/history/" + rev);
  snapCache.set(k, res.data.data);
  return res.data.data;
}

/* ----- History tab ----- */
async function renderHistoryTab() {
  state.openSnapshot = null;
  $("tab-body").innerHTML =
    '<div id="history-notice" role="status" aria-live="polite" aria-atomic="true"></div>' +
    '<div id="history-body"><p class="hint">Loading history…</p></div>';
  let entries;
  try {
    const res = await api("GET",
      "/api/apps/" + encodeURIComponent(state.selected) + "/history");
    entries = res.data.data || [];
  } catch (err) {
    $("history-body").innerHTML = notice("error", esc(errText(err)));
    return;
  }
  if (!entries.length) {
    $("history-body").innerHTML = '<p class="hist-empty">No earlier revisions yet. ' +
      "Every save you make is recorded here.</p>";
    return;
  }
  const rows = entries.map((e) => {
    const current = e.revision === state.revision;
    return '<tr data-rev="' + e.revision + '">' +
      '<td class="mono-data">r' + esc(e.revision) +
      (current ? '<span class="cur-dot" role="img" aria-label="current"></span><span class="cur-txt"> (current)</span>' : "") +
      "</td>" +
      '<td class="mono-data hist-when" title="' + esc(absTime(e.updated_at)) + '">' +
      '<span class="rel">' + esc(relTime(e.updated_at) || "—") + "</span></td>" +
      '<td class="chg-cell" data-chg="' + e.revision + '">' +
      '<span class="chg-path faint">…</span></td>' +
      '<td class="row-actions"><button class="link" data-view="' + e.revision + '"' +
      ' aria-expanded="false" aria-label="Show what changed in revision ' + e.revision + '">' +
      "Changes</button>" +
      '<button class="link" data-restore="' + e.revision + '"' +
      ' aria-label="Restore revision ' + e.revision + '"' +
      (current || state.readOnly ? " disabled" : "") + ">Restore</button></td>" +
      "</tr>";
  }).join("");
  $("history-body").innerHTML =
    '<div class="history-wrap"><table class="history-table"><thead><tr>' +
    "<th>Revision</th><th>Written</th><th>Changed</th>" +
    '<th><span class="sr-only">Actions</span></th>' +
    "</tr></thead><tbody>" + rows + "</tbody></table></div>";
  $("history-body").querySelectorAll("[data-view]").forEach((b) => {
    b.onclick = () => toggleHistorySnapshot(parseInt(b.dataset.view, 10), b.closest("tr"), b);
  });
  $("history-body").querySelectorAll("[data-restore]").forEach((b) => {
    b.onclick = () => restoreHistorySnapshot(parseInt(b.dataset.restore, 10));
  });
  fillChangeSummaries(entries);
}

/* Each row summarises itself against its predecessor. Fetched newest-first and
   rendered as they land, so the table is useful before the last one arrives. */
async function fillChangeSummaries(entries) {
  const app = state.selected;
  const byRev = {};
  entries.forEach((e) => { byRev[e.revision] = e; });
  for (const e of entries) {
    if (state.selected !== app || state.activeTab !== "history") return;
    const cell = document.querySelector('.chg-cell[data-chg="' + e.revision + '"]');
    if (!cell) continue;
    const prev = byRev[e.revision - 1];
    if (!prev) {
      cell.innerHTML = '<span class="chg-none">created</span>';
      continue;
    }
    try {
      const [a, b] = await Promise.all([
        getSnapshot(app, e.revision - 1),
        getSnapshot(app, e.revision),
      ]);
      if (state.selected !== app || !cell.isConnected) return;
      const rows = diffLines(stableLines(a.config), stableLines(b.config));
      const schemaChanged = JSON.stringify(a.schema) !== JSON.stringify(b.schema);
      if (!rows) { cell.innerHTML = '<span class="chg-none">too large to compare</span>'; continue; }
      const st = diffStat(rows);
      const paths = changedPaths(rows);
      if (!st.add && !st.del) {
        cell.innerHTML = schemaChanged
          ? '<span class="chg-schema">schema only</span>'
          : '<span class="chg-none">no change</span>';
        continue;
      }
      const stat = (st.add ? '<span class="chg-add">+' + st.add + "</span> " : "") +
        (st.del ? '<span class="chg-del">−' + st.del + "</span>" : "");
      const label = paths.length
        ? paths.slice(0, 2).join(", ") + (paths.length > 2 ? " +" + (paths.length - 2) + " more" : "")
        : "";
      cell.innerHTML = '<span class="chg"><span class="chg-stat">' + stat + "</span>" +
        '<span class="chg-path">' + esc(label) + "</span>" +
        (schemaChanged ? '<span class="chg-schema">· schema</span>' : "") + "</span>";
    } catch (_) {
      if (cell.isConnected) cell.innerHTML = '<span class="chg-none">—</span>';
    }
  }
}

/* Expands inline under its row. The default view is a diff — a history's job
   is answering "what changed", and a full document dump makes the reader do
   that comparison in their own head. The raw snapshot stays one click away. */
async function toggleHistorySnapshot(revision, tr, btn) {
  const existing = document.querySelector(".snap-row");
  const wasOpen = state.openSnapshot === revision;
  document.querySelectorAll("[data-view]").forEach((b) =>
    b.setAttribute("aria-expanded", "false"));
  if (existing) existing.remove();
  state.openSnapshot = null;
  if (wasOpen) return;
  const row = document.createElement("tr");
  row.className = "snap-row";
  const td = document.createElement("td");
  td.colSpan = 4;
  td.innerHTML = '<p class="snap-head">Loading r' + esc(revision) + "…</p>";
  row.appendChild(td);
  tr.after(row);
  state.openSnapshot = revision;
  if (btn) btn.setAttribute("aria-expanded", "true");
  state.snapMode = state.snapMode || "diff";
  await paintSnapshot(revision, td);
}

async function paintSnapshot(revision, td) {
  const app = state.selected;
  const mode = state.snapMode === "raw" ? "raw" : "diff";
  const against = state.snapAgainst === "current" ? "current" : "previous";
  try {
    const snap = await getSnapshot(app, revision);
    if (state.openSnapshot !== revision || !td.isConnected) return;
    if (mode === "raw") {
      td.innerHTML = snapHead(revision, "raw", against) +
        '<pre class="snap-pre"><code>' +
        highlightJSON(JSON.stringify({ config: snap.config, schema: snap.schema }, null, 2)) +
        "</code></pre>";
      bindSnapHead(revision, td);
      return;
    }
    // `from` is always the older side, so + and − read in reading order.
    let from, to, label;
    if (against === "current") {
      from = snap.config;
      to = state.configObj;
      label = "r" + revision + " → current (r" + state.revision + ")";
    } else if (revision <= 1) {
      td.innerHTML = snapHead(revision, "diff", against) +
        '<p class="hint">r1 is the first revision — there is nothing before it ' +
        "to compare against.</p>";
      bindSnapHead(revision, td);
      return;
    } else {
      const prev = await getSnapshot(app, revision - 1);
      from = prev.config;
      to = snap.config;
      label = "r" + (revision - 1) + " → r" + revision;
    }
    if (state.openSnapshot !== revision || !td.isConnected) return;
    const rows = diffLines(stableLines(from), stableLines(to));
    if (!rows) {
      td.innerHTML = snapHead(revision, "diff", against) +
        '<p class="hint">These revisions are too large to compare here. ' +
        "Switch to the raw snapshot.</p>";
      bindSnapHead(revision, td);
      return;
    }
    const st = diffStat(rows);
    const body = (!st.add && !st.del)
      ? '<p class="hint">No difference in the configuration.</p>'
      : renderDiff(collapse(rows, 3));
    td.innerHTML = snapHead(revision, "diff", against, label, st) + body;
    bindSnapHead(revision, td);
  } catch (err) {
    if (td.isConnected) td.innerHTML = notice("error", esc(errText(err)));
  }
}

function snapHead(revision, mode, against, label, st) {
  const stat = st && (st.add || st.del)
    ? '<span class="chg-stat"><span class="chg-add">+' + st.add + "</span> " +
      '<span class="chg-del">−' + st.del + "</span></span>"
    : "";
  return '<p class="diff-head">' +
    "<span>" + esc(label || ("r" + revision)) + "</span>" + stat +
    '<span class="spacer"></span>' +
    (mode === "diff"
      ? '<button class="link" data-against>' +
        (against === "current" ? "Compare with previous" : "Compare with current") +
        "</button>"
      : "") +
    '<button class="link" data-mode>' +
    (mode === "raw" ? "Show changes" : "Show full snapshot") + "</button></p>";
}

function bindSnapHead(revision, td) {
  const m = td.querySelector("[data-mode]");
  if (m) m.onclick = () => {
    state.snapMode = state.snapMode === "raw" ? "diff" : "raw";
    paintSnapshot(revision, td);
  };
  const a = td.querySelector("[data-against]");
  if (a) a.onclick = () => {
    state.snapAgainst = state.snapAgainst === "current" ? "previous" : "current";
    paintSnapshot(revision, td);
  };
}

async function restoreHistorySnapshot(revision) {
  if (anyDirty() && !(await confirmDiscard())) return;
  // Say what the restore will actually change, not just how the mechanism
  // works — nobody should have to roll back an incident blind.
  let effect = "";
  try {
    const snap = await getSnapshot(state.selected, revision);
    const rows = diffLines(stableLines(state.configObj), stableLines(snap.config));
    if (rows) {
      const st = diffStat(rows);
      const paths = changedPaths(rows);
      effect = (!st.add && !st.del)
        ? "The configuration is already identical to r" + revision + "."
        : "This changes " + paths.slice(0, 3).join(", ") +
          (paths.length > 3 ? " and " + (paths.length - 3) + " more" : "") +
          " (+" + st.add + " −" + st.del + " lines). ";
    }
  } catch (_) { /* fall back to the mechanism-only description */ }
  if (!(await confirmDialog({
    title: "Restore revision " + revision + "?",
    body: effect + "This creates a new revision holding r" + revision +
      "'s config and schema. Nothing is erased — you can restore back again " +
      "at any time.",
    confirmLabel: "Restore",
  }))) return;
  try {
    await api("POST",
      "/api/apps/" + encodeURIComponent(state.selected) + "/rollback",
      { revision: revision, expected_revision: state.revision });
    await refreshApps();
    // Stay on History. The operator restored from this table, and the table
    // now reports the result in place — the new revision appears as current,
    // with its own diff. Switching tabs would be a context change nobody
    // asked for.
    await loadAppDetail(state.selected);
    toast("Restored r" + revision + " — now r" + state.revision + ".");
  } catch (err) {
    slotNotice("history-notice", notice("error", esc(errText(err))));
  }
}

/* ----- Dirty tracking ----- */
function isConfigDirty() { return !!(configEd && configEd.value !== state.pristine); }
function isSchemaDirty() { return !!(schemaEd && schemaEd.value !== state.schemaPristine); }
function configDraftDirty() {
  return configEd ? isConfigDirty()
    : state.drafts.config != null && state.drafts.config !== state.pristine;
}
function schemaDraftDirty() {
  return schemaEd ? isSchemaDirty()
    : state.drafts.schema != null && state.drafts.schema !== state.schemaPristine;
}
function anyDirty() { return configDraftDirty() || schemaDraftDirty(); }

function setStatus(id, dirty) {
  const s = $(id);
  if (!s) return;
  if (state.readOnly) { s.textContent = "read-only"; return; }
  // The literal strings below are load-bearing (asserted by the UI tests);
  // the bullet is styled amber via .sdot.
  if (dirty) s.innerHTML = '<span class="sdot">●</span> Unsaved changes';
  else s.textContent = "Saved";
  s.classList.toggle("dirty", dirty);
}

/* A tab whose live buffer or stashed draft is dirty shows an amber dot. */
function updateTabDots() {
  const dots = {
    config: configDraftDirty(),
    schema: schemaDraftDirty(),
  };
  for (const tab of ["config", "schema"]) {
    const el = document.querySelector('.tab[data-tab="' + tab + '"] .tab-dot');
    if (el) el.hidden = !dots[tab];
  }
}

/* refresh and Discard both reload from the server, which drops EVERY draft —
   including the other tab's. So their visibility keys off anyDirty(), not the
   current tab's dirty flag; otherwise a clean Configuration tab offers an
   unguarded "refresh" that silently deletes unsaved schema work. */
function updateDirty() {
  const dirty = isConfigDirty();
  setStatus("editor-status", dirty);
  const save = $("save-btn");
  // Disabling the button the user just pressed orphans focus on <body>;
  // hand it to the status text, which is what now describes the outcome.
  if (save && !dirty && document.activeElement === save) {
    const s = $("editor-status");
    if (s) s.focus();
  }
  if (save) { save.disabled = !dirty; save.classList.toggle("armed", dirty); }
  const other = anyDirty();
  const r = $("refresh-link"), d = $("discard-link"), sep = $("editor-aux-sep");
  if (r) r.hidden = other || state.readOnly;
  if (d) d.hidden = !other || state.readOnly;
  if (sep) sep.hidden = state.readOnly;
  updateTabDots();
}
function updateSchemaDirty() {
  const dirty = isSchemaDirty();
  setStatus("schema-status", dirty);
  const save = $("schema-save-btn");
  if (save && !dirty && document.activeElement === save) {
    const s = $("schema-status");
    if (s) s.focus();
  }
  if (save) { save.disabled = !dirty; save.classList.toggle("armed", dirty); }
  const other = anyDirty();
  const r = $("schema-refresh-link"), d = $("schema-discard-link"), sep = $("schema-aux-sep");
  if (r) r.hidden = other || state.readOnly;
  if (d) d.hidden = !other || state.readOnly;
  if (sep) sep.hidden = state.readOnly;
  updateTabDots();
}

async function confirmDiscard() {
  if (!anyDirty()) return true;
  const parts = [];
  if (configDraftDirty()) parts.push("configuration");
  if (schemaDraftDirty()) parts.push("schema");
  return confirmDialog({
    title: "Discard unsaved changes?",
    body: 'Unsaved ' + parts.join(" and ") + ' edits to "' + state.selected +
      '" will be lost.',
    confirmLabel: "Discard",
    cancelLabel: "Keep editing",
    danger: true,
  });
}

/* ----- Configuration actions ----- */
async function formatConfig() {
  try {
    if (!configEd.value.trim()) return;
    configEd.value = await convertFormat(configEd.value, state.configFormat, state.configFormat);
    updateDirty();
    configNotice("");
  } catch (e) {
    configNotice(notice("error", "<strong>Can't tidy this.</strong> The " +
      state.configFormat.toUpperCase() + " has a syntax error — fix it and try again."));
  }
}

async function validateConfig() {
  try {
    const { data } = await api("POST",
      "/api/apps/" + encodeURIComponent(state.selected) + "/validate",
      { data: configEd.value, format: state.configFormat });
    if (!data.valid) {
      const n = data.errors.length;
      configNotice(notice("error",
        "<strong>" + n + (n === 1 ? " problem" : " problems") +
        " in this configuration.</strong><ul>" +
        data.errors.map((e) => {
          const m = String(e).match(/^([^:\s][^:]*):\s*(.+)$/);
          if (!m) return "<li>" + esc(e) + "</li>";
          const path = m[1] === "root" ? "(top level)" : m[1];
          return '<li><code class="err-path">' + esc(path) + "</code> " + esc(m[2]) + "</li>";
        }).join("") + "</ul>"));
      return;
    }
    // The server reports valid:true when there is nothing to validate against.
    // Saying "valid against the schema" there would manufacture confidence out
    // of nothing — Validate is exactly the button pressed to avoid that.
    if (!state.schema) {
      configNotice(notice("warn",
        "<strong>The " + state.configFormat.toUpperCase() + " parses.</strong> " +
        "This app has no schema, so no rules were checked. " +
        '<button class="link" id="validate-to-schema">Add a schema</button>'));
      const go = $("validate-to-schema");
      if (go) go.onclick = () => switchTab("schema");
      return;
    }
    configNotice(notice("ok", "Valid — this config satisfies the schema."), true);
  } catch (err) {
    configNotice(notice("error",
      "<strong>Couldn't check this config.</strong> " + esc(errText(err))));
  }
}

function conflictNotice(err, reloadId) {
  const d = err.detail || {};
  const lead = d.actual != null
    ? "<strong>Someone else saved first.</strong> This app is now at r" +
      esc(d.actual) + ", and your edits are based on r" + esc(d.expected) +
      ". Your changes are still here, unsaved."
    : "<strong>Someone else saved first.</strong> " + esc(errText(err));
  return notice("warn", lead +
    ' <button class="link" id="' + reloadId + '">Load the server\'s version</button>');
}

async function saveConfig() {
  const save = $("save-btn");
  if (save) save.disabled = true;
  try {
    const { data } = await api("PUT",
      "/api/apps/" + encodeURIComponent(state.selected) + "/config",
      { data: configEd.value, format: state.configFormat, revision: state.revision });
    applyRevision(data.revision);
    state.configObj = data.data;
    state.pristine = await serialize(state.configObj, state.configFormat);
    configEd.value = state.pristine;
    configNotice("");
    toast("Saved — r" + state.revision + ".");
    await refreshApps();
  } catch (err) {
    if (err.status === 409) {
      configNotice(conflictNotice(err, "conflict-reload"));
      // Adopting the server's version throws away the buffer in front of you —
      // the same discard every other path in this file confirms first.
      $("conflict-reload").onclick = async () => {
        if (await confirmDiscard()) loadAppDetail(state.selected);
      };
    } else if (err.status === 400 && problemCount(err.detail) > 1) {
      const n = problemCount(err.detail);
      configNotice(notice("error",
        "<strong>Didn't save — " + n + " problems in this configuration.</strong>" +
        errorList(err.detail)));
    } else {
      configNotice(notice("error",
        "<strong>Didn't save.</strong> " + esc(errText(err))));
    }
  } finally {
    updateDirty();
  }
}

/* ----- Schema actions ----- */
async function formatSchema() {
  try {
    if (!schemaEd.value.trim()) { schemaNotice(""); return; }
    schemaEd.value = await convertFormat(schemaEd.value, state.schemaFormat, state.schemaFormat);
    updateSchemaDirty();
    schemaNotice("");
  } catch (e) {
    schemaNotice(notice("error", "<strong>Can't tidy this.</strong> The " +
      state.schemaFormat.toUpperCase() + " has a syntax error — fix it and try again."));
  }
}

async function saveSchema() {
  const raw = schemaEd.value.trim();
  const body = { revision: state.revision };
  if (raw) { body.schema = schemaEd.value; body.schema_format = state.schemaFormat; }
  else { body.schema = null; }
  const save = $("schema-save-btn");
  if (save) save.disabled = true;
  try {
    const { data } = await api("PUT",
      "/api/apps/" + encodeURIComponent(state.selected) + "/schema", body);
    applyRevision(data.revision);
    state.schema = data.schema;
    state.schemaPristine = data.schema ? await serialize(data.schema, state.schemaFormat) : "";
    schemaEd.value = state.schemaPristine;
    setSchemaFlag();
    schemaNotice(notice("ok",
      state.schema ? "✓ Schema saved." : "✓ Schema cleared."), true);
    toast("Schema saved — r" + state.revision + ".");
    await refreshApps();
  } catch (err) {
    if (err.status === 409) {
      schemaNotice(conflictNotice(err, "schema-conflict-reload"));
      $("schema-conflict-reload").onclick = () => loadAppDetail(state.selected);
    } else {
      // A 400 here usually means the current config violates the new schema.
      schemaNotice(notice("error", "<strong>Schema rejected.</strong> " + esc(errText(err))));
    }
  } finally {
    updateSchemaDirty();
  }
}

function setSchemaFlag() {
  const flag = $("schema-flag");
  if (!flag) return;
  flag.innerHTML = state.schema
    ? "Schema attached"
    : '<span class="faint">No schema</span>';
}

function applyRevision(rev) {
  if (rev == null) return;
  state.revision = rev;
  const label = $("rev-label");
  if (label) label.textContent = rev;
}

async function deleteApp() {
  const name = state.selected;
  if (!(await confirmDialog({
    title: 'Delete "' + name + '"?',
    body: "This removes the app, its history, and disconnects its watchers. " +
      "It cannot be undone.",
    confirmLabel: "Delete",
    danger: true,
  }))) return;
  try {
    await api("DELETE", "/api/apps/" + encodeURIComponent(name));
    closeWs();
    state.selected = null;
    clearDrafts();
    showEmptyMain();
    await refreshApps();
    toast('"' + name + '" deleted.');
  } catch (err) {
    toast("Couldn't delete — " + errText(err));
  }
}

/* ===================================================================== */
/* WebSocket — live updates                                                */
/* ===================================================================== */
function closeWs() {
  clearTimeout(state.wsRetry);
  if (state.ws) {
    state.ws.onclose = null;
    try { state.ws.close(); } catch (_) {}
    state.ws = null;
  }
}

function openWs(name, attempt) {
  closeWs();
  attempt = attempt || 0;
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(
    proto + "://" + location.host + BASE + "/ws/" + encodeURIComponent(name)
  );
  state.ws = ws;
  ws.onopen = () => { setLive(true); attempt = 0; };
  ws.onclose = (ev) => {
    setLive(false);
    if (state.selected !== name) return;
    if (ev.code === 4004) {
      // The app was deleted server-side: reconnecting is pointless. Refresh
      // the list, which also clears the stale editor pane for a gone app.
      refreshApps().catch(() => {});
      return;
    }
    if (ev.code === 1008) {
      // Auth rejected: retrying with the same credentials cannot succeed.
      clearInterval(state.appsPoll);
      showConnect();
      $("connect-error").textContent =
        "Your session ended. Sign in again to keep receiving live updates.";
      return;
    }
    // Reconnect with exponential backoff, capped at 30s. Never give up: a
    // server restart minutes later should not leave the UI silently stale.
    const delay = Math.min(30000, 2000 * Math.pow(2, attempt));
    state.wsRetry = setTimeout(() => openWs(name, attempt + 1), delay);
  };
  ws.onmessage = (ev) => {
    if (state.ws !== ws) return;
    let msg;
    try { msg = JSON.parse(ev.data); } catch (_) { return; }
    if (msg.app !== state.selected) return;
    if (msg.type === "initial_config" || msg.type === "update") onRemoteUpdate(msg);
  };
}

function setLive(on) {
  const dot = $("live-dot"), label = $("live-label");
  // "offline" read as "you have no internet"; the UI still works over REST —
  // it is only the live-update socket that dropped.
  if (label) label.textContent = on ? "Live" : "Reconnecting…";
  if (dot) {
    const was = dot.classList.contains("on");
    dot.classList.toggle("on", on);
    dot.classList.toggle("off", !on);
    if (on && !was) {
      // One-shot connect pulse (2 iterations, never infinite).
      dot.classList.remove("pulse");
      void dot.offsetWidth;
      dot.classList.add("pulse");
    }
    if (!on) dot.classList.remove("pulse");
  }
}

async function onRemoteUpdate(msg) {
  // Apply monotonically: ignore out-of-order or duplicate broadcasts whose
  // revision is not newer than what we already have. Revisions start over
  // after an ephemeral server restart, so generation changes reset the scope.
  const generationChanged = !!(msg.generation && state.generation &&
    msg.generation !== state.generation);
  if (!generationChanged && msg.revision != null && state.revision != null &&
      msg.revision <= state.revision) return;
  if (msg.generation) state.generation = msg.generation;
  refreshApps().catch(() => {});
  if (anyDirty()) {
    // Do NOT adopt the new revision or reset pristine while there are unsaved
    // edits: the eventual Save must carry the OLD revision so the server can
    // 409 instead of silently overwriting the other writer's change. The
    // conflict-on-save flow then guides the user.
    const warn = notice("warn",
      "<strong>Someone else just saved this app</strong> (it's now at r" +
      esc(msg.revision) + "). Your changes are still here, unsaved — saving " +
      "now will report a conflict." +
      ' <button class="link" id="accept-remote">Load the server\'s version</button>');
    const acceptRemote = async () => { if (await confirmDiscard()) loadAppDetail(state.selected); };
    if (state.activeTab === "config" && configEd) {
      configNotice(warn);
      $("accept-remote").onclick = acceptRemote;
    } else if (state.activeTab === "schema" && schemaEd) {
      schemaNotice(warn);
      $("accept-remote").onclick = acceptRemote;
    }
    return;
  }
  applyRevision(msg.revision);
  if (msg.data !== undefined) {
    state.configObj = msg.data;
    if (state.activeTab === "config" && configEd) {
      let incoming;
      try { incoming = await serialize(msg.data, state.configFormat); }
      catch (_) { incoming = JSON.stringify(msg.data, null, 2); }
      state.pristine = incoming;
      configEd.value = incoming;
      updateDirty();
    } else {
      // Keep pristine in sync so a later return to the config tab is clean.
      try { state.pristine = await serialize(msg.data, state.configFormat); }
      catch (_) { state.pristine = JSON.stringify(msg.data, null, 2); }
    }
  }
  if (Object.prototype.hasOwnProperty.call(msg, "schema")) {
    state.schema = msg.schema;
    if (state.schema) {
      const rendered = await serializeSafe(state.schema, state.schemaFormat, "schema");
      state.schemaFormat = rendered.fmt;
      state.schemaPristine = rendered.text;
    } else {
      state.schemaPristine = "";
    }
    if (state.activeTab === "schema" && schemaEd) {
      schemaEd.value = state.schemaPristine;
      updateSchemaDirty();
    }
    setSchemaFlag();
  }
  if (Object.prototype.hasOwnProperty.call(msg, "description")) {
    if (state.apps[state.selected]) state.apps[state.selected].description = msg.description;
    const desc = $("app-description");
    if (desc) {
      desc.textContent = msg.description || "No description";
      desc.classList.toggle("none", !msg.description);
    }
  }
  if (state.activeTab === "history") renderHistoryTab();
}

/* ===================================================================== */
/* Modals                                                                  */
/* ===================================================================== */
function openModal(html, opts) {
  const ov = $("modal-overlay");
  // Restore focus to whatever opened the modal once it closes (WCAG 2.4.3) —
  // confirmDialog already did this; openModal dropped focus to <body>.
  ov._invoker = document.activeElement;
  // Optional guard: asked before a backdrop click or Escape throws away work.
  // snapshot/restore let the modal survive the confirm that reuses this overlay.
  ov._guard = opts && opts.guard;
  ov._snapshot = opts && opts.snapshot;
  ov._restore = opts && opts.restore;
  ov.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' + html + "</div>";
  ov.classList.remove("hidden");
  // Announce the modal by its heading, like confirmDialog does.
  const heading = ov.querySelector("h3");
  if (heading) {
    if (!heading.id) heading.id = "modal-title";
    ov.firstElementChild.setAttribute("aria-labelledby", heading.id);
  }
  ov.onclick = (e) => { if (e.target === ov) tryCloseModal(); };
  // Pull focus off whatever was behind the overlay (e.g. a code editor) so
  // keystrokes land in the modal, not the editor underneath it.
  if (document.activeElement && document.activeElement.blur) {
    document.activeElement.blur();
  }
  const first = ov.querySelector("input, textarea, select, button");
  if (first) first.focus();
  // Keep Tab focus inside the modal while it is open.
  ov.onkeydown = (e) => {
    if (e.key !== "Tab") return;
    const f = ov.querySelectorAll("input, textarea, select, button");
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault(); last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault(); first.focus();
    }
  };
}
function closeModal() {
  const ov = $("modal-overlay");
  const invoker = ov._invoker;
  ov.classList.add("hidden");
  ov.innerHTML = "";
  ov._guard = null;
  ov._snapshot = null;
  ov._restore = null;
  ov._invoker = null;
  if (invoker && invoker.isConnected && invoker.focus) invoker.focus();
}

/* Dismissing by backdrop click or Escape is the most accidental gesture a
   user makes; on a modal holding typed work it must ask first. confirmDialog
   reuses this same overlay, so the fields are snapshotted before it opens and
   put back verbatim if the user chooses to keep editing. */
async function tryCloseModal() {
  const ov = $("modal-overlay");
  const guard = ov._guard, snapshot = ov._snapshot, restore = ov._restore;
  if (!guard || !guard()) { closeModal(); return; }
  const snap = snapshot ? snapshot() : null;
  const discard = await confirmDialog({
    title: "Discard this draft?",
    body: "What you have typed here will be lost.",
    confirmLabel: "Discard",
    cancelLabel: "Keep editing",
    danger: true,
  });
  if (!discard && restore) restore(snap);
}

/* Styled promise-based confirm — replaces every native confirm(). Cancel is
   a text link, confirm an ink-stamp button (danger fill when destructive). */
function confirmDialog(opts) {
  return new Promise((resolve) => {
    const invoker = document.activeElement;
    const ov = $("modal-overlay");
    ov.innerHTML =
      '<div class="modal" id="confirm-dialog" role="dialog" aria-modal="true"' +
      ' aria-labelledby="confirm-title">' +
      '<h3 id="confirm-title">' + esc(opts.title) + "</h3>" +
      '<p class="confirm-body">' + esc(opts.body || "") + "</p>" +
      '<div class="modal-actions">' +
      '<button class="link" id="confirm-cancel">' + esc(opts.cancelLabel || "Cancel") + "</button>" +
      '<button class="btn' + (opts.danger ? " danger" : "") + '" id="confirm-accept">' +
      esc(opts.confirmLabel || "OK") + "</button>" +
      "</div></div>";
    ov.classList.remove("hidden");
    let settled = false;
    const done = (val) => {
      if (settled) return;
      settled = true;
      closeModal();
      ov.onkeydown = null;
      ov.onclick = null;
      // Restore focus to the invoking element (if it survived the dialog).
      if (invoker && invoker.isConnected && invoker.focus) invoker.focus();
      resolve(val);
    };
    ov.onclick = (e) => { if (e.target === ov) done(false); };
    $("confirm-cancel").onclick = () => done(false);
    $("confirm-accept").onclick = () => done(true);
    // Escape cancels; Tab is trapped between the two actions. Enter on the
    // focused button activates it natively.
    ov.onkeydown = (e) => {
      if (e.key === "Escape") { e.preventDefault(); done(false); return; }
      if (e.key !== "Tab") return;
      e.preventDefault();
      const cancel = $("confirm-cancel"), accept = $("confirm-accept");
      (document.activeElement === accept ? cancel : accept).focus();
    };
    if (invoker && invoker.blur) invoker.blur();
    $("confirm-accept").focus();
  });
}

// Convert a plain modal textarea between formats, tracking the current format
// in a data attribute so the next switch knows the source format. Conversion
// failure re-checks the previous radio (revert-on-fail).
async function changeModalFormat(taId, prefix, to) {
  const ta = $(taId);
  const from = ta.dataset.fmt || "json";
  if (from === to) return;
  if (ta.value.trim()) {
    try { ta.value = await convertFormat(ta.value, from, to); }
    catch (e) {
      $("m-error").textContent = "Cannot convert to " + to.toUpperCase() + ": " + errText(e);
      setFmtSwitcher(prefix, from);
      return;
    }
  }
  ta.dataset.fmt = to;
  $("m-error").textContent = "";
}

const NEW_APP_BLANK = { name: "", desc: "", cfg: "{}", cfgFmt: "json", sch: "", schFmt: "json" };

function openNewAppModal(prefill) {
  const v = Object.assign({}, NEW_APP_BLANK, prefill || {});
  openModal(`
    <h3>New app</h3>
    <div class="field">
      <label class="lbl" for="m-name">Name</label>
      <input class="u-input" id="m-name" placeholder="my-service" value="${esc(v.name)}" />
      <p class="field-hint">letters, digits, - and _</p>
    </div>
    <div class="field">
      <label class="lbl" for="m-desc">Description <span class="opt">(optional)</span></label>
      <input class="u-input" id="m-desc" value="${esc(v.desc)}" />
    </div>
    <div class="field">
      <div class="field-head">
        <label class="lbl" for="m-config">Initial configuration</label>
        ${fmtSwitcher("m-cfg-fmt", v.cfgFmt)}
      </div>
      <textarea class="box-code" id="m-config" rows="6" data-fmt="${esc(v.cfgFmt)}">${esc(v.cfg)}</textarea>
    </div>
    <div class="field">
      <div class="field-head">
        <label class="lbl" for="m-schema">Schema <span class="opt">(optional)</span></label>
        ${fmtSwitcher("m-sch-fmt", v.schFmt)}
      </div>
      <textarea class="box-code" id="m-schema" rows="5" data-fmt="${esc(v.schFmt)}"
        placeholder="Leave empty for no schema">${esc(v.sch)}</textarea>
    </div>
    <div class="modal-error" id="m-error"></div>
    <div class="modal-actions">
      <button class="link" id="m-cancel">Cancel</button>
      <button class="btn" id="m-create">Create app</button>
    </div>
  `, {
    // This is the largest data-entry surface in the app; a stray backdrop
    // click must not silently delete four fields of typed work.
    guard: () => {
      const s = snapshotNewApp();
      return s.name !== "" || s.desc !== "" || s.sch !== "" ||
        (s.cfg !== "" && s.cfg !== "{}");
    },
    snapshot: snapshotNewApp,
    restore: (snap) => openNewAppModal(snap),
  });
  bindFmtSwitcher("m-cfg-fmt", (v2) => changeModalFormat("m-config", "m-cfg-fmt", v2));
  bindFmtSwitcher("m-sch-fmt", (v2) => changeModalFormat("m-schema", "m-sch-fmt", v2));
  $("m-cancel").onclick = tryCloseModal;
  $("m-create").onclick = createApp;
  $("m-name").focus();
}

function snapshotNewApp() {
  return {
    name: ($("m-name") || {}).value || "",
    desc: ($("m-desc") || {}).value || "",
    cfg: ($("m-config") || {}).value || "",
    cfgFmt: ($("m-config") || { dataset: {} }).dataset.fmt || "json",
    sch: ($("m-schema") || {}).value || "",
    schFmt: ($("m-schema") || { dataset: {} }).dataset.fmt || "json",
  };
}

async function createApp() {
  const name = $("m-name").value.trim();
  const desc = $("m-desc").value.trim();
  if (!name) { $("m-error").textContent = "Name is required."; return; }
  const body = {
    name,
    data: $("m-config").value.trim() || "{}",
    format: $("m-config").dataset.fmt || "json",
  };
  if (desc) body.description = desc;
  const schemaRaw = $("m-schema").value.trim();
  if (schemaRaw) {
    body.schema = schemaRaw;
    body.schema_format = $("m-schema").dataset.fmt || "json";
  }
  try {
    await api("POST", "/api/apps", body);
    closeModal();
    await refreshApps();
    await selectApp(name);
    toast('"' + name + '" created.');
  } catch (e) {
    $("m-error").textContent = errText(e);
  }
}

function openMetaModal() {
  const info = state.apps[state.selected] || {};
  openModal(`
    <h3>Edit app</h3>
    <div class="field">
      <label class="lbl" for="m-name">Name</label>
      <input class="u-input" id="m-name" value="${esc(state.selected)}" />
    </div>
    <div class="field">
      <label class="lbl" for="m-desc">Description</label>
      <input class="u-input" id="m-desc" value="${esc(info.description || "")}" />
    </div>
    <div class="modal-error" id="m-error"></div>
    <div class="modal-actions">
      <button class="link" id="m-cancel">Cancel</button>
      <button class="btn" id="m-save">Save details</button>
    </div>
  `);
  $("m-cancel").onclick = closeModal;
  $("m-save").onclick = saveMeta;
}

async function saveMeta() {
  const name = $("m-name").value.trim();
  const desc = $("m-desc").value.trim();
  if (!name) { $("m-error").textContent = "Name is required."; return; }
  // A rename or a new description leaves the config and schema untouched, so
  // in-flight edits must survive it. loadAppDetail() always adopts server
  // truth and clears drafts, so carry them over it by hand.
  stashDrafts();
  const keep = { config: state.drafts.config, schema: state.drafts.schema };
  try {
    const { data } = await api("PATCH",
      "/api/apps/" + encodeURIComponent(state.selected) + "/metadata",
      { name, description: desc, revision: state.revision });
    closeModal();
    const renamed = data.app.name !== state.selected;
    state.selected = data.app.name;
    state.revision = data.app.revision;
    await refreshApps();
    if (renamed) { closeWs(); openWs(state.selected); }
    renderAppList();
    await loadAppDetail(state.selected);
    if (keep.config != null || keep.schema != null) {
      state.drafts = keep;
      configEd = null;
      schemaEd = null;
      if (state.activeTab === "config") renderConfigTab();
      else if (state.activeTab === "schema") renderSchemaTab();
      updateTabDots();
    }
    toast("Details updated.");
  } catch (e) {
    $("m-error").textContent = errText(e);
  }
}

$("new-app-btn").onclick = () => openNewAppModal();
$("theme-btn").onclick = toggleTheme;
$("nav-toggle").onclick = toggleNav;
$("app-filter").addEventListener("input", renderAppList);
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape" || $("modal-overlay").classList.contains("hidden")) return;
  // A confirm dialog must resolve its promise — cancel it rather than
  // tearing the overlay down around it.
  const cancel = $("confirm-cancel");
  if (cancel) cancel.click();
  else tryCloseModal();
});
window.addEventListener("beforeunload", (e) => {
  if (anyDirty()) { e.preventDefault(); e.returnValue = ""; }
});
