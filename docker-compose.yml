services:
  nacho:
    build:
      context: .
      dockerfile: Dockerfile
    image: k3scat/nacho:latest
    container_name: nacho
    restart: unless-stopped
    ports:
      # Notes: change the host port if conflicting
      - "8000:8000"
    # Optional: mount a custom config file for the default app.
    # volumes:
    #   - ./config.yaml:/app/config.yaml
    command: ["server", "--host", "0.0.0.0", "--config", "config.yaml"]
    # Command Examples:
    # - With auth:      ["server", "--host", "0.0.0.0", "--config", "config.yaml", "--api-key", "your_api_key"]
    # - Read-only mode: ["server", "--host", "0.0.0.0", "--config", "config.yaml", "--read-only"]
    networks:
      - nacho-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

networks:
  nacho-network:
    driver: bridge
    driver_opts:
      # Avoid naming conflicts; optional, WSL-safe
      com.docker.network.bridge.name: nacho-br
